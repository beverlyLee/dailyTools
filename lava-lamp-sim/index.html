<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>熔岩灯模拟器 - Lava Lamp Simulation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      overflow: hidden;
      background: #0a0a0f;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }
    #info {
      position: absolute;
      top: 20px;
      left: 20px;
      color: rgba(255, 100, 50, 0.9);
      z-index: 100;
      text-shadow: 0 0 10px rgba(255, 100, 50, 0.5);
    }
    #info h1 {
      font-size: 1.5rem;
      margin-bottom: 8px;
    }
    #info p {
      font-size: 0.9rem;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div id="canvas-container">
    <div id="info">
      <h1>🔥 熔岩灯模拟器</h1>
      <p>基于密度和热对流的 SPH 粒子模拟</p>
    </div>
  </div>
  <script type="module" src="/src/App.ts"></script>
</body>
</html>
