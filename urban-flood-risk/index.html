<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>城市内涝风险评估系统</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        #container {
            width: 100%;
            height: 100%;
            display: flex;
        }
        #map {
            flex: 1;
            height: 100%;
        }
        #sidebar {
            width: 360px;
            background: white;
            border-left: 1px solid #eee;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #sidebar-header {
            padding: 20px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
        }
        #sidebar-header h1 {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
        }
        #sidebar-header p {
            margin: 8px 0 0;
            font-size: 14px;
            opacity: 0.8;
        }
        #risk-stats {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .stat-item {
            flex: 1;
            text-align: center;
            padding: 10px;
            background: rgba(255,255,255,0.2);
            border-radius: 8px;
        }
        .stat-value {
            font-size: 24px;
            font-weight: bold;
        }
        .stat-label {
            font-size: 12px;
            opacity: 0.9;
        }
        #zone-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        .zone-item {
            padding: 15px;
            border: 1px solid #eee;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .zone-item:hover {
            border-color: #2a5298;
            box-shadow: 0 2px 8px rgba(42, 82, 152, 0.15);
        }
        .zone-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .zone-name {
            font-weight: 600;
            color: #333;
        }
        .risk-badge {
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }
        .risk-badge.high {
            background: #fee2e2;
            color: #dc2626;
        }
        .risk-badge.medium {
            background: #fef3c7;
            color: #f59e0b;
        }
        .risk-badge.low {
            background: #dcfce7;
            color: #22c55e;
        }
        .zone-score {
            font-size: 20px;
            font-weight: bold;
            color: #2a5298;
            margin-bottom: 5px;
        }
        .zone-meta {
            font-size: 12px;
            color: #888;
        }
        #detail-panel {
            padding: 20px;
            background: #f8fafc;
            border-top: 1px solid #eee;
            display: none;
        }
        #detail-panel.active {
            display: block;
        }
        #detail-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        #detail-title {
            font-size: 16px;
            font-weight: 600;
        }
        #close-detail {
            cursor: pointer;
            color: #999;
            font-size: 20px;
            line-height: 1;
        }
        #image-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            max-height: 200px;
            overflow-y: auto;
        }
        .flood-image {
            width: 100%;
            height: 80px;
            object-fit: cover;
            border-radius: 6px;
        }
        #filter-bar {
            padding: 10px 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            gap: 10px;
        }
        .filter-btn {
            padding: 6px 12px;
            border: 1px solid #ddd;
            border-radius: 20px;
            background: white;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }
        .filter-btn.active {
            background: #2a5298;
            color: white;
            border-color: #2a5298;
        }
        .filter-btn:hover {
            border-color: #2a5298;
            color: #2a5298;
        }
        .filter-btn.active:hover {
            background: #1e3c72;
            color: white;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="map"></div>
        <div id="sidebar">
            <div id="sidebar-header">
                <h1>城市内涝风险评估</h1>
                <p>基于社交媒体爆料与市政数据</p>
                <div id="risk-stats">
                    <div class="stat-item">
                        <div class="stat-value" id="high-count">0</div>
                        <div class="stat-label">高风险</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="medium-count">0</div>
                        <div class="stat-label">中风险</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="low-count">0</div>
                        <div class="stat-label">低风险</div>
                    </div>
                </div>
            </div>
            <div id="filter-bar">
                <button class="filter-btn active" data-level="all">全部</button>
                <button class="filter-btn" data-level="high">高风险</button>
                <button class="filter-btn" data-level="medium">中风险</button>
                <button class="filter-btn" data-level="low">低风险</button>
            </div>
            <div id="zone-list"></div>
            <div id="detail-panel">
                <div id="detail-header">
                    <span id="detail-title"></span>
                    <span id="close-detail">&times;</span>
                </div>
                <div id="image-grid"></div>
            </div>
        </div>
    </div>

    <script type="text/javascript" src="https://webapi.amap.com/maps?v=1.4.15&key=%GAODE_API_KEY%"></script>
    <script>
        var map = new AMap.Map('map', {
            center: [116.403322, 39.920255],
            zoom: 12,
            mapStyle: 'amap://styles/normal'
        });

        var heatmap;
        var markers = [];
        var currentZone = null;

        function initHeatmap(data) {
            if (heatmap) {
                map.remove(heatmap);
            }
            
            var heatmapData = data.map(function(item) {
                return {
                    lng: item.lng,
                    lat: item.lat,
                    count: item.weight * 100
                };
            });
            
            heatmap = new AMap.Heatmap(map, {
                radius: 25,
                gradient: {
                    0.4: '#22c55e',
                    0.65: '#f59e0b',
                    0.85: '#dc2626',
                    1.0: '#991b1b'
                },
                opacity: [0.3, 0.8]
            });
            
            heatmap.setDataSet({ data: heatmapData, max: 100 });
        }

        function addMarkers(zones) {
            markers.forEach(function(marker) {
                map.remove(marker);
            });
            markers = [];
            
            zones.forEach(function(zone) {
                var color = zone.risk_level === 'high' ? '#dc2626' : 
                           zone.risk_level === 'medium' ? '#f59e0b' : '#22c55e';
                
                var marker = new AMap.Marker({
                    position: [zone.center_lng, zone.center_lat],
                    icon: new AMap.Icon({
                        size: new AMap.Size(24, 24),
                        image: createCircleIcon(color),
                        imageSize: new AMap.Size(24, 24)
                    }),
                    title: zone.name,
                    extData: zone
                });
                
                marker.on('click', function(e) {
                    showZoneDetail(e.target.getExtData());
                });
                
                markers.push(marker);
            });
            
            map.add(markers);
        }

        function createCircleIcon(color) {
            var canvas = document.createElement('canvas');
            canvas.width = 24;
            canvas.height = 24;
            var ctx = canvas.getContext('2d');
            
            ctx.beginPath();
            ctx.arc(12, 12, 10, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
            
            ctx.beginPath();
            ctx.arc(12, 12, 6, 0, Math.PI * 2);
            ctx.fillStyle = 'white';
            ctx.fill();
            
            return canvas.toDataURL();
        }

        function showZoneDetail(zone) {
            currentZone = zone;
            document.getElementById('detail-title').textContent = zone.name;
            document.getElementById('detail-title').innerHTML += 
                '<span style="font-weight:normal; font-size:14px; margin-left:10px;">风险评分: ' + zone.risk_score + '</span>';
            
            var imageGrid = document.getElementById('image-grid');
            imageGrid.innerHTML = '';
            
            zone.reports.forEach(function(report) {
                var img = document.createElement('img');
                img.className = 'flood-image';
                img.src = report.image_url;
                img.title = report.description;
                imageGrid.appendChild(img);
            });
            
            document.getElementById('detail-panel').classList.add('active');
            
            map.setCenter([zone.center_lng, zone.center_lat]);
            map.setZoom(16);
        }

        function renderZoneList(zones) {
            var list = document.getElementById('zone-list');
            list.innerHTML = '';
            
            zones.forEach(function(zone) {
                var item = document.createElement('div');
                item.className = 'zone-item';
                item.innerHTML = `
                    <div class="zone-header">
                        <span class="zone-name">${zone.name}</span>
                        <span class="risk-badge ${zone.risk_level}">${zone.risk_level === 'high' ? '高风险' : zone.risk_level === 'medium' ? '中风险' : '低风险'}</span>
                    </div>
                    <div class="zone-score">${zone.risk_score}</div>
                    <div class="zone-meta">爆料数量: ${zone.report_count} | 点击查看详情</div>
                `;
                item.onclick = function() {
                    showZoneDetail(zone);
                };
                list.appendChild(item);
            });
        }

        function updateStats(zones) {
            var high = zones.filter(function(z) { return z.risk_level === 'high'; }).length;
            var medium = zones.filter(function(z) { return z.risk_level === 'medium'; }).length;
            var low = zones.filter(function(z) { return z.risk_level === 'low'; }).length;
            
            document.getElementById('high-count').textContent = high;
            document.getElementById('medium-count').textContent = medium;
            document.getElementById('low-count').textContent = low;
        }

        var currentFilter = 'all';
        var allZones = [];

        fetch('/api/risk_zones')
            .then(function(response) { return response.json(); })
            .then(function(zones) {
                allZones = zones;
                updateStats(zones);
                renderZoneList(zones);
                addMarkers(zones);
                
                fetch('/api/heatmap')
                    .then(function(res) { return res.json(); })
                    .then(function(heatmapData) {
                        initHeatmap(heatmapData);
                    });
            });

        document.getElementById('close-detail').onclick = function() {
            document.getElementById('detail-panel').classList.remove('active');
            currentZone = null;
        };

        document.querySelectorAll('.filter-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.filter-btn').forEach(function(b) {
                    b.classList.remove('active');
                });
                this.classList.add('active');
                currentFilter = this.dataset.level;
                
                if (currentFilter === 'all') {
                    renderZoneList(allZones);
                    addMarkers(allZones);
                } else {
                    var filtered = allZones.filter(function(z) {
                        return z.risk_level === currentFilter;
                    });
                    renderZoneList(filtered);
                    addMarkers(filtered);
                }
            });
        });
    </script>
</body>
</html>
