<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>吊顶灯光效果预览器 - Ceiling Light Effect Previewer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background: #0a0a0a;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #e0e0e0;
    }

    canvas {
      display: block;
    }

    .control-panel {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 320px;
      background: rgba(20, 20, 25, 0.92);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(100, 150, 255, 0.2);
      border-radius: 12px;
      padding: 18px;
      z-index: 100;
      max-height: calc(100vh - 40px);
      overflow-y: auto;
    }

    .control-panel::-webkit-scrollbar {
      width: 6px;
    }

    .control-panel::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 3px;
    }

    .control-panel::-webkit-scrollbar-thumb {
      background: rgba(100, 150, 255, 0.3);
      border-radius: 3px;
    }

    .panel-title {
      font-size: 17px;
      font-weight: 600;
      color: #8ab4ff;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(100, 150, 255, 0.2);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .panel-section {
      margin-bottom: 18px;
    }

    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: #a0b4d0;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .control-item {
      margin-bottom: 12px;
    }

    .control-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #b0b8c8;
      margin-bottom: 5px;
    }

    .control-value {
      color: #8ab4ff;
      font-weight: 500;
      font-family: monospace;
    }

    input[type="range"] {
      width: 100%;
      height: 4px;
      -webkit-appearance: none;
      appearance: none;
      background: rgba(100, 150, 255, 0.15);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      background: #8ab4ff;
      border-radius: 50%;
      cursor: pointer;
      transition: transform 0.2s;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    .toggle-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      background: rgba(100, 150, 255, 0.1);
      border: 1px solid rgba(100, 150, 255, 0.3);
      border-radius: 6px;
      color: #c0c8d8;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .toggle-btn:hover {
      background: rgba(100, 150, 255, 0.2);
      border-color: rgba(100, 150, 255, 0.5);
    }

    .toggle-btn.active {
      background: rgba(100, 150, 255, 0.3);
      border-color: #8ab4ff;
      color: #ffffff;
    }

    .color-preview {
      width: 24px;
      height: 24px;
      border-radius: 4px;
      border: 2px solid rgba(255, 255, 255, 0.2);
    }

    .glare-warning {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: rgba(255, 80, 80, 0.15);
      border: 1px solid rgba(255, 80, 80, 0.4);
      border-radius: 8px;
      color: #ff8080;
      font-size: 12px;
      margin-top: 10px;
    }

    .glare-warning.hidden {
      display: none;
    }

    .glare-icon {
      font-size: 16px;
    }

    .info-badge {
      display: inline-block;
      padding: 3px 8px;
      background: rgba(100, 150, 255, 0.15);
      border-radius: 4px;
      font-size: 11px;
      color: #8ab4ff;
      margin-left: 6px;
    }

    .row {
      display: flex;
      gap: 10px;
    }

    .row > * {
      flex: 1;
    }

    .controls-hint {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: rgba(20, 20, 25, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(100, 150, 255, 0.2);
      border-radius: 10px;
      padding: 10px 16px;
      color: #a0b4d0;
      font-size: 12px;
      z-index: 100;
    }

    .controls-hint kbd {
      background: rgba(100, 150, 255, 0.15);
      padding: 2px 6px;
      border-radius: 4px;
      margin: 0 2px;
      font-family: monospace;
      color: #8ab4ff;
    }

    .stats-section {
      margin-top: 4px;
      padding-top: 14px;
    }

    .stats-divider {
      height: 1px;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(100, 150, 255, 0.3),
        transparent
      );
      margin-bottom: 12px;
    }

    .stats-title {
      font-size: 12px;
      font-weight: 600;
      color: #a0b4d0;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stats-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .stats-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px;
      background: rgba(100, 150, 255, 0.06);
      border-radius: 6px;
      border: 1px solid rgba(100, 150, 255, 0.1);
    }

    .stats-label {
      color: #8892a8;
      font-size: 11px;
    }

    .stats-value {
      color: #8ab4ff;
      font-size: 13px;
      font-weight: 600;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="control-panel">
    <div class="panel-title">
      <span>💡</span>
      吊顶灯光效果预览器
    </div>

    <div class="panel-section">
      <div class="section-title">吊顶结构</div>
      <div class="control-item">
        <div class="control-label">
          <span>房间宽度</span>
          <span class="control-value" id="roomWidthValue">8m</span>
        </div>
        <input type="range" id="roomWidth" min="4" max="15" step="0.5" value="8">
      </div>
      <div class="control-item">
        <div class="control-label">
          <span>房间深度</span>
          <span class="control-value" id="roomDepthValue">6m</span>
        </div>
        <input type="range" id="roomDepth" min="3" max="12" step="0.5" value="6">
      </div>
      <div class="control-item">
        <div class="control-label">
          <span>房间高度</span>
          <span class="control-value" id="roomHeightValue">2.8m</span>
        </div>
        <input type="range" id="roomHeight" min="2.2" max="4" step="0.1" value="2.8">
      </div>
      <div class="control-item">
        <div class="control-label">
          <span>吊顶下垂</span>
          <span class="control-value" id="ceilingDropValue">0.15m</span>
        </div>
        <input type="range" id="ceilingDrop" min="0.05" max="0.4" step="0.01" value="0.15">
      </div>
      <div class="control-item">
        <div class="control-label">
          <span>灯槽宽度</span>
          <span class="control-value" id="trenchWidthValue">0.12m</span>
        </div>
        <input type="range" id="trenchWidth" min="0.05" max="0.3" step="0.01" value="0.12">
      </div>
      <div class="control-item">
        <div class="control-label">
          <span>灯槽深度</span>
          <span class="control-value" id="trenchDepthValue">0.08m</span>
        </div>
        <input type="range" id="trenchDepth" min="0.03" max="0.2" step="0.01" value="0.08">
      </div>
    </div>

    <div class="panel-section">
      <div class="section-title">光源参数</div>
      <div class="control-item">
        <div class="control-label">
          <span>光源类型</span>
          <span class="info-badge" id="lightTypeBadge">AreaLight</span>
        </div>
        <div class="row">
          <button class="toggle-btn active" id="areaLightBtn">面光源</button>
          <button class="toggle-btn" id="tubeLightBtn">管光源</button>
        </div>
      </div>
      <div class="control-item">
        <div class="control-label">
          <span>亮度</span>
          <span class="control-value" id="intensityValue">500 cd/m²</span>
        </div>
        <input type="range" id="intensity" min="50" max="2000" step="10" value="500">
      </div>
      <div class="control-item">
        <div class="control-label">
          <span>色温</span>
          <span class="control-value" id="colorTempValue">4000K</span>
        </div>
        <input type="range" id="colorTemp" min="2000" max="8000" step="100" value="4000">
      </div>
      <div class="control-item">
        <div class="control-label">
          <span>光色预览</span>
          <div class="color-preview" id="colorPreview" style="background: #ffeedd;"></div>
        </div>
      </div>
    </div>

    <div class="panel-section">
      <div class="section-title">间接照明</div>
      <div class="control-item">
        <div class="control-label">
          <span>光线反弹次数</span>
          <span class="control-value" id="bounceCountValue">2</span>
        </div>
        <input type="range" id="bounceCount" min="0" max="4" step="1" value="2">
      </div>
      <div class="control-item">
        <div class="control-label">
          <span>墙面反射率</span>
          <span class="control-value" id="wallAlbedoValue">0.70</span>
        </div>
        <input type="range" id="wallAlbedo" min="0.1" max="0.95" step="0.01" value="0.7">
      </div>
      <div class="control-item">
        <div class="control-label">
          <span>天花板反射率</span>
          <span class="control-value" id="ceilingAlbedoValue">0.85</span>
        </div>
        <input type="range" id="ceilingAlbedo" min="0.1" max="0.95" step="0.01" value="0.85">
      </div>
      <div class="glare-warning hidden" id="glareWarning">
        <span class="glare-icon">⚠️</span>
        <span>检测到眩光：光源直接进入视锥范围</span>
      </div>
    </div>

    <div class="panel-section">
      <div class="section-title">洗墙效果</div>
      <div class="control-item">
        <div class="control-label">
          <span>洗墙强度</span>
          <span class="control-value" id="wallWashIntensityValue">1.0</span>
        </div>
        <input type="range" id="wallWashIntensity" min="0" max="2" step="0.05" value="1.0">
      </div>
      <div class="control-item">
        <div class="control-label">
          <span>光束角度</span>
          <span class="control-value" id="beamAngleValue">45°</span>
        </div>
        <input type="range" id="beamAngle" min="10" max="90" step="1" value="45">
      </div>
      <div class="control-item">
        <div class="control-label">
          <span>光晕扩散</span>
          <span class="control-value" id="haloSpreadValue">0.5</span>
        </div>
        <input type="range" id="haloSpread" min="0.1" max="2" step="0.05" value="0.5">
      </div>
    </div>

    <div class="panel-section">
      <div class="section-title">视图控制</div>
      <div class="row">
        <button class="toggle-btn" id="viewFrontBtn">正视</button>
        <button class="toggle-btn" id="viewSideBtn">侧视</button>
        <button class="toggle-btn" id="viewIsoBtn">轴测</button>
      </div>
    </div>

    <div class="stats-section">
      <div class="stats-divider"></div>
      <div class="stats-title">实时数据</div>
      <div class="stats-grid">
        <div class="stats-item">
          <span class="stats-label">间接光照贡献</span>
          <span class="stats-value" id="indirectContribution">35%</span>
        </div>
        <div class="stats-item">
          <span class="stats-label">墙面平均亮度</span>
          <span class="stats-value" id="wallBrightness">120 lux</span>
        </div>
        <div class="stats-item">
          <span class="stats-label">眩光指数 UGR</span>
          <span class="stats-value" id="ugrValue">18</span>
        </div>
      </div>
    </div>
  </div>

  <div class="controls-hint">
    <kbd>鼠标左键</kbd> 旋转 | <kbd>滚轮</kbd> 缩放 | <kbd>右键</kbd> 平移
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
