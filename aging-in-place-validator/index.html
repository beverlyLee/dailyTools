<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%233498db'/%3E%3Ccircle cx='20' cy='42' r='10' fill='%232c3e50'/%3E%3Ccircle cx='44' cy='42' r='10' fill='%232c3e50'/%3E%3Crect x='14' y='24' width='36' height='6' rx='2' fill='%23ffffff'/%3E%3Crect x='14' y='10' width='4' height='24' rx='2' fill='%232c3e50'/%3E%3Crect x='46' y='10' width='4' height='24' rx='2' fill='%232c3e50'/%3E%3C/svg%3E" />
    <title>适老化改造验证系统 - Aging in Place Validator</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { 
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
        overflow: hidden; 
        background: #1a1a2e;
      }
      #app { width: 100vw; height: 100vh; position: relative; }
      #ui {
        position: absolute;
        top: 20px;
        left: 20px;
        background: rgba(255, 255, 255, 0.95);
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        max-width: 340px;
        z-index: 100;
      }
      #ui h1 {
        font-size: 18px;
        color: #2c3e50;
        margin-bottom: 16px;
        border-bottom: 2px solid #3498db;
        padding-bottom: 8px;
      }
      #ui h2 {
        font-size: 14px;
        color: #34495e;
        margin: 12px 0 8px 0;
      }
      .btn-group { display: flex; flex-direction: column; gap: 8px; }
      button {
        padding: 10px 16px;
        border: none;
        border-radius: 6px;
        background: #3498db;
        color: white;
        cursor: pointer;
        font-size: 14px;
        transition: all 0.2s;
        font-weight: 500;
      }
      button:hover { background: #2980b9; transform: translateY(-1px); }
      button:disabled { background: #95a5a6; cursor: not-allowed; transform: none; }
      button.danger { background: #e74c3c; }
      button.danger:hover { background: #c0392b; }
      button.success { background: #27ae60; }
      button.success:hover { background: #229954; }
      #status-panel {
        margin-top: 16px;
        padding: 12px;
        background: #f8f9fa;
        border-radius: 8px;
        border-left: 4px solid #3498db;
      }
      #status-panel.error { border-left-color: #e74c3c; background: #fdf2f2; }
      #status-panel.success { border-left-color: #27ae60; background: #f0fdf4; }
      #status-panel.warning { border-left-color: #f39c12; background: #fffbeb; }
      #status-title { font-weight: 600; color: #2c3e50; margin-bottom: 6px; }
      #status-message { font-size: 13px; color: #555; line-height: 1.5; }
      #collision-points {
        margin-top: 8px;
        padding: 8px;
        background: #fff;
        border-radius: 4px;
        font-size: 12px;
        color: #e74c3c;
        max-height: 100px;
        overflow-y: auto;
      }
      .info-row {
        display: flex;
        justify-content: space-between;
        padding: 4px 0;
        font-size: 13px;
      }
      .info-label { color: #7f8c8d; }
      .info-value { color: #2c3e50; font-weight: 500; }
      .info-value.pass { color: #27ae60; }
      .info-value.fail { color: #e74c3c; }
      #controls-hint {
        position: absolute;
        bottom: 20px;
        left: 20px;
        background: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 12px 16px;
        border-radius: 8px;
        font-size: 12px;
        line-height: 1.6;
      }
      #controls-hint kbd {
        background: #34495e;
        padding: 2px 6px;
        border-radius: 3px;
        font-family: monospace;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="ui">
        <h1>🛗 适老化改造验证系统</h1>
        
        <h2>操作控制</h2>
        <div class="btn-group">
          <button id="btn-rotate">🔄 开始轮椅回转测试</button>
          <button id="btn-stop" class="danger" disabled>⏹ 停止测试</button>
          <button id="btn-reset">↩️ 重置场景</button>
        </div>

        <h2>专项验证</h2>
        <div class="btn-group">
          <button id="btn-verify-width" class="success">📏 验证门洞净宽</button>
          <button id="btn-verify-grab" class="success">🖐 验证扶手可达性</button>
        </div>

        <h2>实时参数</h2>
        <div class="info-row">
          <span class="info-label">轮椅尺寸</span>
          <span class="info-value">65cm × 120cm</span>
        </div>
        <div class="info-row">
          <span class="info-label">最小回转半径</span>
          <span class="info-value">1.5m</span>
        </div>
        <div class="info-row">
          <span class="info-label">回转角度</span>
          <span class="info-value" id="angle-value">0°</span>
        </div>
        <div class="info-row">
          <span class="info-label">门洞净宽</span>
          <span class="info-value fail" id="width-value">0.75m</span>
        </div>

        <div id="status-panel" class="info">
          <div id="status-title">系统就绪</div>
          <div id="status-message">点击「开始轮椅回转测试」验证卫生间空间是否满足适老化标准。</div>
          <div id="collision-points" style="display:none;"></div>
        </div>
      </div>
      <div id="controls-hint">
        <strong>操作指南：</strong><br/>
        🖱 <kbd>鼠标左键</kbd> 旋转视角 | <kbd>鼠标右键</kbd> 平移<br/>
        <kbd>滚轮</kbd> 缩放 | 点击按钮执行验证
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
