<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D 日晷 - Digital Sundial</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 100%);
    }
    
    canvas {
      display: block;
    }
    
    #controls {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.95);
      padding: 20px 30px;
      border-radius: 15px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      z-index: 100;
      min-width: 320px;
    }
    
    #controls h3 {
      margin: 0 0 15px 0;
      color: #2c3e50;
      font-size: 16px;
      font-weight: 600;
      text-align: center;
    }
    
    .control-row {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 12px;
    }
    
    .control-row label {
      color: #5d6d7e;
      font-size: 14px;
      min-width: 60px;
    }
    
    .control-row input[type="range"] {
      flex: 1;
      height: 6px;
      border-radius: 3px;
      background: #ddd;
      outline: none;
      -webkit-appearance: none;
    }
    
    .control-row input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #3498db;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(52, 152, 219, 0.4);
      transition: transform 0.2s;
    }
    
    .control-row input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.1);
    }
    
    .control-row .value {
      color: #2c3e50;
      font-weight: 600;
      font-size: 14px;
      min-width: 100px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    
    #currentTime {
      text-align: center;
      padding-top: 10px;
      border-top: 1px solid #eee;
      margin-top: 5px;
    }
    
    #currentTime .label {
      color: #5d6d7e;
      font-size: 12px;
      margin-bottom: 4px;
    }
    
    #currentTime .time {
      color: #e74c3c;
      font-size: 24px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    
    #info {
      position: fixed;
      top: 20px;
      left: 20px;
      background: rgba(255, 255, 255, 0.9);
      padding: 15px 20px;
      border-radius: 10px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      z-index: 100;
    }
    
    #info h2 {
      margin: 0 0 8px 0;
      color: #2c3e50;
      font-size: 18px;
    }
    
    #info p {
      margin: 0;
      color: #5d6d7e;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div id="info">
    <h2>3D 日晷</h2>
    <p>拖动时间滑块观察影子变化</p>
  </div>
  
  <div id="controls">
    <h3>时间控制</h3>
    <div class="control-row">
      <label>时间:</label>
      <input type="range" id="timeSlider" min="0" max="1440" value="720" step="1">
      <span class="value" id="timeValue">12:00</span>
    </div>
    <div class="control-row">
      <label>日期:</label>
      <input type="range" id="dateSlider" min="0" max="364" value="172" step="1">
      <span class="value" id="dateValue">6月22日</span>
    </div>
    <div id="currentTime">
      <div class="label">晷针指向时刻</div>
      <div class="time" id="sundialTime">--:--</div>
    </div>
  </div>
  
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
