<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>阳台洗衣区安装验证系统 - Laundry Area Validator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background: #1a1a2e;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    canvas {
      display: block;
    }

    .control-panel {
      position: fixed;
      top: 20px;
      left: 20px;
      background: rgba(26, 26, 46, 0.92);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(100, 149, 237, 0.3);
      border-radius: 14px;
      padding: 18px 22px;
      color: #e8eaf6;
      z-index: 100;
      width: 320px;
      max-height: calc(100vh - 40px);
      overflow-y: auto;
    }

    .control-panel::-webkit-scrollbar {
      width: 6px;
    }

    .control-panel::-webkit-scrollbar-thumb {
      background: rgba(100, 149, 237, 0.4);
      border-radius: 3px;
    }

    .control-panel h1 {
      font-size: 17px;
      margin-bottom: 14px;
      color: #81d4fa;
      font-weight: 600;
      border-bottom: 1px solid rgba(100, 149, 237, 0.2);
      padding-bottom: 10px;
    }

    .control-section {
      margin-bottom: 16px;
    }

    .control-section label {
      display: block;
      font-size: 12px;
      margin-bottom: 6px;
      color: #b0bec5;
      font-weight: 500;
    }

    .control-section select,
    .control-section input[type="range"] {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid rgba(100, 149, 237, 0.3);
      border-radius: 7px;
      background: rgba(30, 30, 55, 0.8);
      color: #e8eaf6;
      font-size: 13px;
      outline: none;
    }

    .control-section select:focus {
      border-color: #64b5f6;
    }

    .control-section input[type="range"] {
      padding: 0;
      height: 6px;
      -webkit-appearance: none;
      background: rgba(100, 149, 237, 0.2);
    }

    .control-section input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #64b5f6;
      cursor: pointer;
    }

    .value-display {
      display: inline-block;
      font-size: 12px;
      color: #81d4fa;
      margin-left: 8px;
      font-weight: 600;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .checkbox-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #64b5f6;
      cursor: pointer;
    }

    .checkbox-row label {
      margin-bottom: 0;
      cursor: pointer;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    .btn {
      flex: 1;
      padding: 9px 12px;
      border: none;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .btn-secondary {
      background: rgba(100, 149, 237, 0.15);
      color: #90caf9;
      border: 1px solid rgba(100, 149, 237, 0.3);
    }

    .btn-secondary:hover {
      background: rgba(100, 149, 237, 0.25);
    }

    .results-panel {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(26, 26, 46, 0.92);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(100, 149, 237, 0.3);
      border-radius: 14px;
      padding: 18px 22px;
      color: #e8eaf6;
      z-index: 100;
      width: 320px;
      max-height: calc(100vh - 40px);
      overflow-y: auto;
    }

    .results-panel::-webkit-scrollbar {
      width: 6px;
    }

    .results-panel::-webkit-scrollbar-thumb {
      background: rgba(100, 149, 237, 0.4);
      border-radius: 3px;
    }

    .results-panel h2 {
      font-size: 16px;
      margin-bottom: 14px;
      color: #81d4fa;
      font-weight: 600;
      border-bottom: 1px solid rgba(100, 149, 237, 0.2);
      padding-bottom: 10px;
    }

    .result-item {
      padding: 10px 12px;
      margin-bottom: 8px;
      border-radius: 8px;
      font-size: 12.5px;
      line-height: 1.5;
      border-left: 3px solid;
    }

    .result-pass {
      background: rgba(76, 175, 80, 0.1);
      border-color: #4caf50;
      color: #a5d6a7;
    }

    .result-warn {
      background: rgba(255, 152, 0, 0.1);
      border-color: #ff9800;
      color: #ffcc80;
    }

    .result-error {
      background: rgba(244, 67, 54, 0.12);
      border-color: #f44336;
      color: #ef9a9a;
    }

    .result-item .icon {
      margin-right: 6px;
    }

    .result-item .detail {
      font-size: 11px;
      opacity: 0.85;
      margin-top: 4px;
      padding-left: 20px;
    }

    .overall-status {
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 14px;
    }

    .overall-pass {
      background: linear-gradient(135deg, rgba(76, 175, 80, 0.2), rgba(76, 175, 80, 0.1));
      color: #a5d6a7;
      border: 1px solid rgba(76, 175, 80, 0.3);
    }

    .overall-warn {
      background: linear-gradient(135deg, rgba(255, 152, 0, 0.2), rgba(255, 152, 0, 0.1));
      color: #ffcc80;
      border: 1px solid rgba(255, 152, 0, 0.3);
    }

    .overall-error {
      background: linear-gradient(135deg, rgba(244, 67, 54, 0.2), rgba(244, 67, 54, 0.1));
      color: #ef9a9a;
      border: 1px solid rgba(244, 67, 54, 0.3);
    }

    .controls-hint {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(26, 26, 46, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(100, 149, 237, 0.3);
      border-radius: 20px;
      padding: 10px 22px;
      color: #b0bec5;
      font-size: 12.5px;
      z-index: 100;
    }

    .controls-hint kbd {
      background: rgba(100, 149, 237, 0.2);
      padding: 2px 8px;
      border-radius: 5px;
      margin: 0 3px;
      font-family: 'Consolas', monospace;
      font-size: 11px;
      color: #81d4fa;
    }

    .device-info {
      background: rgba(30, 30, 55, 0.6);
      padding: 10px;
      border-radius: 8px;
      font-size: 11px;
      line-height: 1.7;
      color: #90caf9;
      margin-top: 6px;
    }

    .device-info div {
      display: flex;
      justify-content: space-between;
    }

    .device-info span:last-child {
      color: #ffcc80;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="control-panel">
    <h1>🧺 洗衣区安装验证控制台</h1>

    <div class="control-section">
      <label>布局模式</label>
      <select id="layoutMode">
        <option value="stacked">叠放安装（烘干机在上）</option>
        <option value="sidebyside">并排安装</option>
        <option value="washer_only">仅洗衣机</option>
      </select>
    </div>

    <div class="control-section">
      <label>洗衣机型号</label>
      <select id="washerModel">
        <option value="siemens_wm14p2680w">西门子 WM14P2680W (10kg)</option>
        <option value="haier_eg100max5s">海尔 EG100MAX5S (10kg)</option>
        <option value="xiaomi_xhqg100mj103">米家 XHQG100MJ103 (10kg)</option>
        <option value="bosch_wau28568hw">博世 WAU28568HW (10kg)</option>
      </select>
      <div class="device-info" id="washerInfo"></div>
    </div>

    <div class="control-section" id="dryerSection">
      <label>烘干机型号</label>
      <select id="dryerModel">
        <option value="siemens_wt47w5680w">西门子 WT47W5680W (9kg 热泵)</option>
        <option value="haier_gbn10018u1">海尔 GBN100-18U1 (10kg 热泵)</option>
        <option value="xiaomi_thp100wm201">米家 THP100WM201 (10kg 热泵)</option>
        <option value="bosch_wtw87568hw">博世 WTW87568HW (9kg 热泵)</option>
      </select>
      <div class="device-info" id="dryerInfo"></div>
    </div>

    <div class="control-section">
      <label>阳台深度（前后方向）<span class="value-display" id="depthValue">150 cm</span></label>
      <input type="range" id="balconyDepth" min="80" max="300" value="150" step="1">
    </div>

    <div class="control-section">
      <label>阳台宽度（左右方向）<span class="value-display" id="widthValue">200 cm</span></label>
      <input type="range" id="balconyWidth" min="60" max="400" value="200" step="1">
    </div>

    <div class="control-section">
      <label>设备距后墙距离<span class="value-display" id="backWallValue">5 cm</span></label>
      <input type="range" id="backWallDist" min="0" max="50" value="5" step="1">
    </div>

    <div class="control-section">
      <label>进水龙头高度<span class="value-display" id="faucetHeightValue">110 cm</span></label>
      <input type="range" id="faucetHeight" min="50" max="180" value="110" step="1">
    </div>

    <div class="control-section">
      <label>进水龙头伸出墙面<span class="value-display" id="faucetDepthValue">8 cm</span></label>
      <input type="range" id="faucetDepth" min="0" max="25" value="8" step="1">
    </div>

    <div class="control-section">
      <label>地漏位置 X<span class="value-display" id="drainXValue">60 cm</span></label>
      <input type="range" id="drainX" min="0" max="200" value="60" step="1">
    </div>

    <div class="control-section">
      <label>地漏位置 Z<span class="value-display" id="drainZValue">40 cm</span></label>
      <input type="range" id="drainZ" min="0" max="150" value="40" step="1">
    </div>

    <div class="control-section">
      <div class="checkbox-row">
        <input type="checkbox" id="showDoors" checked>
        <label for="showDoors">显示门开启状态</label>
      </div>
    </div>

    <div class="control-section">
      <div class="checkbox-row">
        <input type="checkbox" id="hasBracket">
        <label for="hasBracket">已安装叠放专用支架</label>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" id="runCheckBtn">🔍 执行全面检测</button>
      <button class="btn btn-secondary" id="resetBtn">↺ 重置</button>
    </div>
  </div>

  <div class="results-panel">
    <h2>📋 检测结果报告</h2>
    <div class="overall-status" id="overallStatus">等待检测...</div>
    <div id="resultList"></div>
  </div>

  <div class="controls-hint">
    <kbd>鼠标左键</kbd> 旋转视角 | <kbd>滚轮</kbd> 缩放 | <kbd>右键</kbd> 平移
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
