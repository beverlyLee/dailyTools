<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>城市公园可达性分析</title>
    <script src='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css' rel='stylesheet' />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }
        
        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
        }
        
        .sidebar {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 320px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            padding: 20px;
            z-index: 100;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
        }
        
        .sidebar h1 {
            font-size: 20px;
            color: #1a1a2e;
            margin-bottom: 16px;
            font-weight: 600;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 16px;
            border-radius: 10px;
            margin-bottom: 16px;
        }
        
        .stat-card h3 {
            font-size: 12px;
            opacity: 0.9;
            margin-bottom: 8px;
        }
        
        .stat-value {
            font-size: 32px;
            font-weight: 700;
        }
        
        .stat-label {
            font-size: 14px;
            opacity: 0.8;
        }
        
        .control-group {
            margin-bottom: 16px;
        }
        
        .control-group label {
            display: block;
            font-size: 13px;
            color: #555;
            margin-bottom: 6px;
            font-weight: 500;
        }
        
        .btn {
            width: 100%;
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            margin-top: 8px;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        
        .layer-controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .layer-btn {
            flex: 1;
            min-width: 80px;
            padding: 8px 12px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .layer-btn.active {
            border-color: #667eea;
            background: #f0f4ff;
            color: #667eea;
        }
        
        .legend {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #e0e0e0;
        }
        
        .legend h4 {
            font-size: 13px;
            color: #555;
            margin-bottom: 12px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            font-size: 12px;
            color: #666;
        }
        
        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            margin-right: 10px;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #f0f0f0;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .mapboxgl-popup {
            max-width: 280px;
        }
        
        .mapboxgl-popup-content {
            border-radius: 10px;
            padding: 16px;
        }
        
        .popup-title {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 8px;
        }
        
        .popup-content {
            font-size: 12px;
            color: #666;
        }
        
        .hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 13px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    
    <div class="sidebar">
        <h1>🏞️ 城市公园可达性分析</h1>
        
        <div class="stat-card">
            <h3>1公里范围内公园覆盖率</h3>
            <div class="stat-value" id="coverage-value">--%</div>
            <div class="stat-label" id="coverage-detail">正在计算...</div>
        </div>
        
        <div class="control-group">
            <label>📍 步行时间（分钟）</label>
            <input type="range" id="travel-time" min="5" max="30" value="10" style="width: 100%;">
            <div style="text-align: center; color: #666; font-size: 13px;"><span id="time-value">10</span> 分钟</div>
        </div>
        
        <div class="control-group">
            <label>🗺️ 图层控制</label>
            <div class="layer-controls">
                <button class="layer-btn active" data-layer="parks">公园</button>
                <button class="layer-btn active" data-layer="residential">居住区</button>
                <button class="layer-btn" data-layer="isochrones">等时圈</button>
                <button class="layer-btn active" data-layer="deserts">公园荒漠</button>
            </div>
        </div>
        
        <div class="control-group">
            <label>⚙️ 操作</label>
            <button class="btn btn-primary" id="load-data">加载深圳南山区数据</button>
            <button class="btn btn-secondary" id="refresh-stats">刷新统计数据</button>
        </div>
        
        <div class="legend">
            <h4>图例</h4>
            <div class="legend-item">
                <div class="legend-color" style="background: rgba(34, 197, 94, 0.6);"></div>
                <span>公园绿地</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: rgba(102, 126, 234, 0.4);"></div>
                <span>可达区域（有公园）</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: rgba(239, 68, 68, 0.6);"></div>
                <span>公园荒漠（无绿地）</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: rgba(59, 130, 246, 0.8);"></div>
                <span>居住区</span>
            </div>
        </div>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div>数据加载中...</div>
        </div>
    </div>
    
    <div class="hint">💡 点击地图任意位置计算步行可达范围</div>

    <script src="app.js"></script>
</body>
</html>
