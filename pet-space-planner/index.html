<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宠物空间规划器 - Pet Space Planner</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background: #1a1a2e;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      color: #e8e8e8;
    }

    canvas {
      display: block;
    }

    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 300px;
      height: 100vh;
      background: rgba(20, 20, 35, 0.95);
      backdrop-filter: blur(12px);
      border-right: 1px solid rgba(100, 180, 255, 0.15);
      z-index: 100;
      overflow-y: auto;
      padding: 20px;
    }

    .sidebar h1 {
      font-size: 20px;
      color: #ffb347;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sidebar .subtitle {
      font-size: 12px;
      color: #888;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .section-title {
      font-size: 13px;
      color: #64b5f6;
      margin: 16px 0 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .section-title:first-child {
      margin-top: 0;
    }

    .item-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .item-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      color: #e8e8e8;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
      text-align: left;
    }

    .item-btn:hover {
      background: rgba(255, 179, 71, 0.12);
      border-color: rgba(255, 179, 71, 0.35);
      transform: translateX(2px);
    }

    .item-btn:active {
      transform: scale(0.98);
    }

    .item-icon {
      font-size: 18px;
      width: 24px;
      text-align: center;
    }

    .controls-panel {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .control-btn {
      width: 100%;
      padding: 10px;
      margin-bottom: 6px;
      background: rgba(100, 181, 246, 0.12);
      border: 1px solid rgba(100, 181, 246, 0.3);
      border-radius: 8px;
      color: #64b5f6;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }

    .control-btn:hover {
      background: rgba(100, 181, 246, 0.2);
    }

    .control-btn.danger {
      background: rgba(239, 83, 80, 0.1);
      border-color: rgba(239, 83, 80, 0.3);
      color: #ef5350;
    }

    .control-btn.danger:hover {
      background: rgba(239, 83, 80, 0.18);
    }

    .control-btn.success {
      background: rgba(102, 187, 106, 0.12);
      border-color: rgba(102, 187, 106, 0.3);
      color: #66bb6a;
    }

    .control-btn.success:hover {
      background: rgba(102, 187, 106, 0.2);
    }

    .analysis-panel {
      position: fixed;
      top: 0;
      right: 0;
      width: 340px;
      max-height: 100vh;
      background: rgba(20, 20, 35, 0.95);
      backdrop-filter: blur(12px);
      border-left: 1px solid rgba(100, 180, 255, 0.15);
      z-index: 100;
      overflow-y: auto;
      padding: 20px;
    }

    .analysis-panel h2 {
      font-size: 16px;
      color: #ffb347;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .alert-card {
      background: rgba(239, 83, 80, 0.1);
      border: 1px solid rgba(239, 83, 80, 0.35);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }

    .alert-card.warning {
      background: rgba(255, 152, 0, 0.1);
      border-color: rgba(255, 152, 0, 0.35);
    }

    .alert-card.info {
      background: rgba(100, 181, 246, 0.1);
      border-color: rgba(100, 181, 246, 0.35);
    }

    .alert-card.success {
      background: rgba(102, 187, 106, 0.1);
      border-color: rgba(102, 187, 106, 0.35);
    }

    .alert-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .alert-card .alert-header {
      color: #ef5350;
    }

    .alert-card.warning .alert-header {
      color: #ff9800;
    }

    .alert-card.info .alert-header {
      color: #64b5f6;
    }

    .alert-card.success .alert-header {
      color: #66bb6a;
    }

    .alert-body {
      font-size: 12px;
      line-height: 1.6;
      color: #bbb;
    }

    .module-section {
      margin-bottom: 18px;
    }

    .module-title {
      font-size: 12px;
      color: #999;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .empty-state {
      padding: 16px;
      text-align: center;
      color: #666;
      font-size: 12px;
      background: rgba(255, 255, 255, 0.02);
      border-radius: 8px;
      border: 1px dashed rgba(255, 255, 255, 0.08);
    }

    .controls-hint {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 20, 35, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 10px 22px;
      color: #aaa;
      font-size: 12px;
      z-index: 100;
    }

    .controls-hint kbd {
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 8px;
      border-radius: 4px;
      margin: 0 3px;
      font-family: monospace;
      color: #ccc;
    }

    .dog-size-select {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .dog-size-btn {
      flex: 1;
      padding: 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      color: #bbb;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }

    .dog-size-btn.active {
      background: rgba(255, 179, 71, 0.18);
      border-color: rgba(255, 179, 71, 0.5);
      color: #ffb347;
    }

    .score-display {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background: rgba(255, 179, 71, 0.08);
      border: 1px solid rgba(255, 179, 71, 0.2);
      border-radius: 10px;
      margin-bottom: 14px;
    }

    .score-label {
      font-size: 12px;
      color: #aaa;
    }

    .score-value {
      font-size: 24px;
      font-weight: 700;
      color: #ffb347;
    }

    .score-value.good {
      color: #66bb6a;
    }

    .score-value.medium {
      color: #ff9800;
    }

    .score-value.poor {
      color: #ef5350;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <h1>🐾 宠物空间规划器</h1>
    <div class="subtitle">为人与宠物共享空间提供智能方案</div>

    <div class="section-title">🏠 家居家具</div>
    <div class="item-list">
      <button class="item-btn" data-type="sofa">
        <span class="item-icon">🛋️</span>
        <span>真皮沙发</span>
      </button>
      <button class="item-btn" data-type="bookshelf">
        <span class="item-icon">📚</span>
        <span>书架</span>
      </button>
      <button class="item-btn" data-type="cabinet">
        <span class="item-icon">🗄️</span>
        <span>储物柜</span>
      </button>
      <button class="item-btn" data-type="table">
        <span class="item-icon">🍽️</span>
        <span>餐桌</span>
      </button>
      <button class="item-btn" data-type="tv-stand">
        <span class="item-icon">📺</span>
        <span>电视柜</span>
      </button>
    </div>

    <div class="section-title">🐱 猫咪设施</div>
    <div class="item-list">
      <button class="item-btn" data-type="cat-tree-large">
        <span class="item-icon">🌳</span>
        <span>大型猫爬架</span>
      </button>
      <button class="item-btn" data-type="cat-tree-small">
        <span class="item-icon">🌿</span>
        <span>小型猫爬架</span>
      </button>
      <button class="item-btn" data-type="cat-scratcher">
        <span class="item-icon">🪵</span>
        <span>猫抓柱</span>
      </button>
      <button class="item-btn" data-type="sisal-post">
        <span class="item-icon">🧶</span>
        <span>剑麻柱</span>
      </button>
      <button class="item-btn" data-type="litter-box">
        <span class="item-icon">📦</span>
        <span>自动猫砂盆</span>
      </button>
    </div>

    <div class="section-title">🐕 狗狗设施</div>
    <div class="item-list">
      <button class="item-btn" data-type="dog-bed">
        <span class="item-icon">🛏️</span>
        <span>狗窝</span>
      </button>
      <button class="item-btn" data-type="dog-bowl">
        <span class="item-icon">🥣</span>
        <span>狗食盆组合</span>
      </button>
    </div>

    <div class="module-section">
      <div class="module-title">🐕 狗狗体型选择</div>
      <div class="dog-size-select">
        <button class="dog-size-btn" data-size="small">小型</button>
        <button class="dog-size-btn active" data-size="medium">中型</button>
        <button class="dog-size-btn" data-size="large">大型</button>
      </div>
    </div>

    <div class="controls-panel">
      <button class="control-btn danger" id="clearBtn">🗑️ 清空场景</button>
      <button class="control-btn" id="resetViewBtn">🎯 重置视角</button>
      <button class="control-btn success" id="analyzeBtn">🔍 全面分析</button>
    </div>
  </div>

  <div class="analysis-panel">
    <h2>📊 空间分析报告</h2>

    <div class="score-display">
      <span class="score-label">空间共享友好度</span>
      <span class="score-value good" id="overallScore">--</span>
    </div>

    <div class="module-section">
      <div class="module-title">🚶 通行路径分析</div>
      <div id="walkwayAnalysis" class="empty-state">
        请先放置家具进行分析
      </div>
    </div>

    <div class="module-section">
      <div class="module-title">🐱 猫咪行动线分析</div>
      <div id="catPathAnalysis" class="empty-state">
        检测猫咪从地面到高处的连续落脚点
      </div>
    </div>

    <div class="module-section">
      <div class="module-title">🐕 狗休息区分析</div>
      <div id="dogRestAnalysis" class="empty-state">
        根据体型推荐狗窝位置（通风+非过道）
      </div>
    </div>

    <div class="module-section">
      <div class="module-title">⚠️ 家具破坏性检测</div>
      <div id="furnitureDamageAnalysis" class="empty-state">
        检测猫抓柱与贵重家具的距离
      </div>
    </div>

    <div class="module-section">
      <div class="module-title">🧹 清洁动线分析</div>
      <div id="cleaningPathAnalysis" class="empty-state">
        模拟清理猫砂盆路径是否经过餐厅
      </div>
    </div>
  </div>

  <div class="controls-hint">
    <kbd>左键</kbd> 旋转 | <kbd>滚轮</kbd> 缩放 | <kbd>右键</kbd> 平移 | <kbd>点击物体</kbd> 选中 | <kbd>Delete</kbd> 删除 | <kbd>拖拽地面</kbd> 放置
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
