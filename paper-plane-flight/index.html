<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>纸飞机飞行模拟 - Paper Plane Flight</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background: #87ceeb;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      cursor: default;
    }

    canvas {
      display: block;
    }

    .hud {
      position: fixed;
      top: 20px;
      left: 20px;
      background: rgba(10, 20, 40, 0.75);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(100, 160, 255, 0.3);
      border-radius: 12px;
      padding: 16px 22px;
      color: #e0f0ff;
      z-index: 100;
      min-width: 180px;
    }

    .hud-title {
      font-size: 16px;
      font-weight: 600;
      color: #7dd3fc;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(100, 160, 255, 0.2);
    }

    .hud-row {
      font-size: 13px;
      line-height: 1.8;
      opacity: 0.9;
      font-variant-numeric: tabular-nums;
    }

    .trail-legend {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid rgba(100, 160, 255, 0.2);
    }

    .trail-legend-title {
      font-size: 11px;
      color: #7dd3fc;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .trail-legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      line-height: 1.6;
      color: rgba(224, 240, 255, 0.8);
    }

    .trail-legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .config-panel {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(10, 20, 40, 0.82);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(100, 160, 255, 0.3);
      border-radius: 12px;
      padding: 18px 22px;
      color: #e0f0ff;
      z-index: 100;
      min-width: 240px;
      user-select: none;
    }

    .config-title {
      font-size: 16px;
      font-weight: 600;
      color: #7dd3fc;
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(100, 160, 255, 0.2);
    }

    .config-row {
      margin-bottom: 12px;
    }

    .config-row label {
      display: block;
      font-size: 13px;
      color: #a0c0e0;
      margin-bottom: 6px;
    }

    .config-slider-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .config-slider-row input[type="range"] {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 6px;
      border-radius: 3px;
      background: rgba(100, 160, 255, 0.25);
      outline: none;
    }

    .config-slider-row input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #7dd3fc;
      cursor: pointer;
      box-shadow: 0 0 6px rgba(125, 211, 252, 0.5);
    }

    .config-val {
      font-size: 13px;
      font-weight: 600;
      color: #7dd3fc;
      min-width: 52px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .throw-btn {
      width: 100%;
      padding: 10px 0;
      margin-top: 8px;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      letter-spacing: 1px;
    }

    .throw-btn:hover {
      background: linear-gradient(135deg, #60a5fa, #3b82f6);
    }

    .throw-btn:active {
      transform: scale(0.97);
    }

    .reset-btn {
      width: 100%;
      padding: 8px 0;
      margin-top: 6px;
      background: rgba(100, 160, 255, 0.15);
      border: 1px solid rgba(100, 160, 255, 0.3);
      border-radius: 8px;
      color: #a0c0e0;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .reset-btn:hover {
      background: rgba(100, 160, 255, 0.25);
    }

    .config-divider {
      height: 1px;
      background: rgba(100, 160, 255, 0.2);
      margin: 14px 0;
    }

    .test-records {
      max-height: 150px;
      overflow-y: auto;
      margin: 8px 0;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 6px;
      padding: 6px;
    }

    .test-records::-webkit-scrollbar {
      width: 4px;
    }

    .test-records::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.1);
      border-radius: 2px;
    }

    .test-records::-webkit-scrollbar-thumb {
      background: rgba(125, 211, 252, 0.5);
      border-radius: 2px;
    }

    .test-record-header {
      display: flex;
      justify-content: space-between;
      padding: 6px 8px;
      font-size: 11px;
      font-weight: 600;
      color: #7dd3fc;
      border-bottom: 1px solid rgba(100, 160, 255, 0.2);
      margin-bottom: 4px;
    }

    .test-record-header span {
      flex: 1;
      text-align: center;
    }

    .test-record-item {
      display: flex;
      justify-content: space-between;
      padding: 5px 8px;
      font-size: 11px;
      color: #e0f0ff;
      border-radius: 4px;
      font-variant-numeric: tabular-nums;
    }

    .test-record-item:hover {
      background: rgba(125, 211, 252, 0.1);
    }

    .test-record-item span {
      flex: 1;
      text-align: center;
    }

    .test-record-item span:last-child {
      color: #4ade80;
      font-weight: 600;
    }

    .clear-records-btn {
      width: 100%;
      padding: 6px 0;
      background: rgba(255, 100, 100, 0.15);
      border: 1px solid rgba(255, 100, 100, 0.3);
      border-radius: 6px;
      color: #fca5a5;
      font-size: 11px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .clear-records-btn:hover {
      background: rgba(255, 100, 100, 0.25);
    }

    .config-hint {
      margin-top: 10px;
      font-size: 11px;
      color: rgba(160, 192, 224, 0.6);
      line-height: 1.5;
      text-align: center;
    }

    .stall-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .stall-overlay.active {
      opacity: 1;
      animation: stall-pulse 0.6s ease-in-out infinite alternate;
    }

    .stall-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ff2222;
      font-size: 36px;
      font-weight: 900;
      text-shadow: 0 0 20px rgba(255, 34, 34, 0.8), 0 0 40px rgba(255, 34, 34, 0.4);
      letter-spacing: 4px;
      white-space: nowrap;
    }

    .stall-overlay.active::before {
      content: '';
      position: absolute;
      inset: 0;
      border: 4px solid rgba(255, 34, 34, 0.6);
      pointer-events: none;
    }

    @keyframes stall-pulse {
      from {
        background: rgba(255, 0, 0, 0.05);
      }
      to {
        background: rgba(255, 0, 0, 0.15);
      }
    }

    .status {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 20, 40, 0.8);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(100, 160, 255, 0.3);
      border-radius: 24px;
      padding: 12px 28px;
      color: #88aaff;
      font-size: 15px;
      z-index: 100;
      transition: color 0.3s;
      text-align: center;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
