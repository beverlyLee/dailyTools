<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>窗户天气模拟系统 - Window Weather Simulation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background: #1a1a2e;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    canvas {
      display: block;
    }

    .control-panel {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(26, 26, 46, 0.95);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(100, 149, 237, 0.3);
      border-radius: 12px;
      padding: 20px;
      color: #e0e7ff;
      z-index: 100;
      width: 300px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .control-panel h2 {
      font-size: 18px;
      margin-bottom: 16px;
      color: #64b5f6;
      font-weight: 600;
      border-bottom: 1px solid rgba(100, 149, 237, 0.2);
      padding-bottom: 10px;
    }

    .control-group {
      margin-bottom: 16px;
    }

    .control-group label {
      display: block;
      font-size: 13px;
      margin-bottom: 6px;
      color: #a5b4fc;
    }

    .control-group select,
    .control-group input[type="range"] {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid rgba(100, 149, 237, 0.3);
      border-radius: 6px;
      background: rgba(30, 30, 50, 0.8);
      color: #e0e7ff;
      font-size: 13px;
      outline: none;
    }

    .control-group select:focus {
      border-color: #64b5f6;
    }

    .control-group input[type="range"] {
      padding: 0;
      height: 6px;
      -webkit-appearance: none;
      appearance: none;
      background: rgba(100, 149, 237, 0.2);
      border-radius: 3px;
    }

    .control-group input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #64b5f6;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(100, 149, 237, 0.5);
    }

    .value-display {
      float: right;
      font-size: 12px;
      color: #64b5f6;
      font-weight: 500;
    }

    .btn-group {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .btn {
      flex: 1;
      padding: 10px 14px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }

    .btn-primary {
      background: linear-gradient(135deg, #64b5f6, #1976d2);
      color: white;
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #7cc4ff, #2196f3);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(100, 149, 237, 0.4);
    }

    .btn-secondary {
      background: rgba(100, 149, 237, 0.15);
      color: #a5b4fc;
      border: 1px solid rgba(100, 149, 237, 0.3);
    }

    .btn-secondary:hover {
      background: rgba(100, 149, 237, 0.25);
    }

    .status-panel {
      position: fixed;
      top: 20px;
      left: 20px;
      background: rgba(26, 26, 46, 0.95);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(100, 149, 237, 0.3);
      border-radius: 12px;
      padding: 16px 20px;
      color: #e0e7ff;
      z-index: 100;
      width: 260px;
    }

    .status-panel h3 {
      font-size: 15px;
      margin-bottom: 12px;
      color: #64b5f6;
    }

    .status-item {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 8px;
      padding: 6px 0;
      border-bottom: 1px solid rgba(100, 149, 237, 0.1);
    }

    .status-item:last-child {
      border-bottom: none;
    }

    .status-label {
      color: #a5b4fc;
    }

    .status-value {
      font-weight: 500;
      color: #e0e7ff;
    }

    .status-value.good {
      color: #4ade80;
    }

    .status-value.warning {
      color: #fbbf24;
    }

    .status-value.danger {
      color: #f87171;
    }

    .water-meter {
      width: 100%;
      height: 8px;
      background: rgba(100, 149, 237, 0.2);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 4px;
    }

    .water-meter-fill {
      height: 100%;
      background: linear-gradient(90deg, #4ade80, #fbbf24, #f87171);
      transition: width 0.3s ease;
      border-radius: 4px;
    }

    .controls-hint {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(26, 26, 46, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(100, 149, 237, 0.3);
      border-radius: 20px;
      padding: 10px 20px;
      color: #a5b4fc;
      font-size: 12px;
      z-index: 100;
    }

    .controls-hint kbd {
      background: rgba(100, 149, 237, 0.2);
      padding: 2px 8px;
      border-radius: 4px;
      margin: 0 2px;
      font-family: monospace;
      color: #e0e7ff;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .toggle-switch {
      position: relative;
      width: 44px;
      height: 24px;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(100, 149, 237, 0.2);
      border-radius: 24px;
      transition: 0.3s;
    }

    .toggle-slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: #a5b4fc;
      border-radius: 50%;
      transition: 0.3s;
    }

    input:checked + .toggle-slider {
      background-color: #64b5f6;
    }

    input:checked + .toggle-slider:before {
      transform: translateX(20px);
      background-color: white;
    }
  </style>
</head>
<body>
  <div class="status-panel">
    <h3>🌧️ 检测状态</h3>
    <div class="status-item">
      <span class="status-label">窗户类型</span>
      <span class="status-value" id="windowType">推拉窗</span>
    </div>
    <div class="status-item">
      <span class="status-label">降雨强度</span>
      <span class="status-value" id="rainIntensity">中雨</span>
    </div>
    <div class="status-item">
      <span class="status-label">风速等级</span>
      <span class="status-value" id="windSpeed">3级</span>
    </div>
    <div class="status-item">
      <span class="status-label">水密性检测</span>
      <span class="status-value" id="waterTightness">正常</span>
    </div>
    <div class="status-item">
      <span class="status-label">气密性检测</span>
      <span class="status-value" id="airTightness">正常</span>
    </div>
    <div class="status-item">
      <span class="status-label">室内进水量</span>
      <span class="status-value" id="waterAmount">0 ml</span>
    </div>
    <div class="water-meter">
      <div class="water-meter-fill" id="waterMeter" style="width: 0%"></div>
    </div>
  </div>

  <div class="control-panel">
    <h2>⚙️ 控制面板</h2>
    
    <div class="control-group">
      <label>窗户类型</label>
      <select id="windowTypeSelect">
        <option value="sliding">推拉窗（有缝隙）</option>
        <option value="casement">平开窗（有胶条）</option>
      </select>
    </div>

    <div class="control-group">
      <label>
        降雨强度
        <span class="value-display" id="rainValue">50%</span>
      </label>
      <input type="range" id="rainSlider" min="0" max="100" value="50">
    </div>

    <div class="control-group">
      <label>
        风速等级
        <span class="value-display" id="windValue">50%</span>
      </label>
      <input type="range" id="windSlider" min="0" max="100" value="50">
    </div>

    <div class="control-group">
      <div class="toggle-row">
        <span class="status-label">显示排水路径</span>
        <label class="toggle-switch">
          <input type="checkbox" id="drainToggle" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>
    </div>

    <div class="control-group">
      <div class="toggle-row">
        <span class="status-label">显示窗帘</span>
        <label class="toggle-switch">
          <input type="checkbox" id="curtainToggle" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>
    </div>

    <div class="btn-group">
      <button class="btn btn-primary" id="stormBtn">🌪️ 台风模式</button>
      <button class="btn btn-secondary" id="resetBtn">🔄 重置</button>
    </div>
  </div>

  <div class="controls-hint">
    <kbd>鼠标左键</kbd> 旋转视角 | <kbd>鼠标滚轮</kbd> 缩放 | <kbd>鼠标右键</kbd> 平移
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
