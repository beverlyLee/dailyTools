<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mycelium Network - 菌丝网络可视化</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0d08;
    }
    
    canvas {
      display: block;
    }
    
    .info-panel {
      position: fixed;
      top: 20px;
      left: 20px;
      padding: 16px 20px;
      background: rgba(10, 20, 10, 0.85);
      border: 1px solid rgba(150, 255, 150, 0.3);
      border-radius: 10px;
      font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
      font-size: 13px;
      color: #8fcc8f;
      z-index: 1000;
      backdrop-filter: blur(10px);
      line-height: 1.6;
    }
    
    .info-panel h3 {
      color: #aaffaa;
      margin-bottom: 8px;
      font-size: 14px;
    }
    
    .info-panel .tip {
      color: #66aa66;
      font-size: 11px;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="info-panel">
    <h3>🍄 菌丝网络</h3>
    <div>树木数量: <span id="tree-count">0</span></div>
    <div>菌丝连接: <span id="connection-count">0</span></div>
    <div class="tip">点击树木发送糖分脉冲</div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
