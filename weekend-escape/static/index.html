<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>周末出行指南 - Weekend Escape</title>
    <script src='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css' rel='stylesheet' />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #0a0a1a;
            color: #fff;
        }

        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
        }

        #gaode-map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
            display: none;
        }

        #gaode-map .amap-logo,
        #gaode-map .amap-copyright {
            display: none !important;
        }

        .map-fallback {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
        }

        .map-fallback svg {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        .map-fallback-content {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 40px;
        }

        .map-fallback-icon {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.8;
        }

        .map-fallback-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #00d4ff;
        }

        .map-fallback-subtitle {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 30px;
        }

        .fallback-directions-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            max-width: 500px;
            margin: 0 auto;
        }

        .fallback-direction-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            transition: all 0.3s;
            cursor: pointer;
        }

        .fallback-direction-card:hover {
            background: rgba(124, 58, 237, 0.2);
            border-color: rgba(124, 58, 237, 0.5);
            transform: translateY(-2px);
        }

        .fallback-direction-arrow {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .fallback-direction-name {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .fallback-direction-dest {
            font-size: 11px;
            color: #00d4ff;
        }

        .header {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(10, 10, 30, 0.9);
            padding: 20px 30px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            background: linear-gradient(135deg, #00d4ff, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .header .subtitle {
            font-size: 14px;
            color: #94a3b8;
        }

        .header .time-info {
            margin-top: 12px;
            font-size: 12px;
            color: #64748b;
        }

        .header .flow-indicator {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            margin-left: 10px;
        }

        .flow-outbound {
            background: linear-gradient(135deg, #f97316, #ef4444);
        }

        .flow-inbound {
            background: linear-gradient(135deg, #22c55e, #06b6d4);
        }

        .map-status {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            background: rgba(10, 10, 30, 0.9);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 13px;
        }

        .map-status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .map-status-dot.loading {
            background: #eab308;
        }

        .map-status-dot.success {
            background: #22c55e;
            animation: none;
        }

        .map-status-dot.error {
            background: #ef4444;
            animation: none;
        }

        .map-status-dot.fallback {
            background: #f97316;
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .map-switch-btn {
            padding: 4px 12px;
            background: rgba(124, 58, 237, 0.3);
            border: none;
            border-radius: 12px;
            color: #a78bfa;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .map-switch-btn:hover {
            background: rgba(124, 58, 237, 0.5);
        }

        .sidebar {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 320px;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
            z-index: 100;
            background: rgba(10, 10, 30, 0.9);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sidebar-header h2 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .sidebar-header p {
            font-size: 12px;
            color: #94a3b8;
        }

        .direction-list {
            padding: 10px 0;
        }

        .direction-item {
            padding: 15px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
            transition: background 0.2s;
        }

        .direction-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .direction-item.active {
            background: rgba(124, 58, 237, 0.2);
            border-left: 3px solid #7c3aed;
        }

        .direction-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .direction-name {
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .direction-arrow {
            font-size: 20px;
        }

        .direction-volume {
            font-size: 12px;
            padding: 3px 10px;
            border-radius: 12px;
            background: rgba(124, 58, 237, 0.3);
            color: #a78bfa;
        }

        .direction-destination {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 8px;
        }

        .destination-name {
            color: #00d4ff;
            font-weight: 500;
        }

        .progress-bar {
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #7c3aed);
            border-radius: 3px;
            transition: width 0.5s ease;
        }

        .congestion-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
            font-size: 11px;
            color: #64748b;
        }

        .congestion-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .error-panel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 200;
            background: rgba(10, 10, 30, 0.95);
            padding: 30px 40px;
            border-radius: 16px;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(239, 68, 68, 0.3);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            max-width: 480px;
            text-align: center;
            display: none;
        }

        .error-panel.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translate(-50%, -60%);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%);
            }
        }

        .error-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .error-title {
            font-size: 20px;
            font-weight: 600;
            color: #ef4444;
            margin-bottom: 12px;
        }

        .error-message {
            font-size: 14px;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .error-steps {
            text-align: left;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .error-steps h4 {
            font-size: 13px;
            color: #eab308;
            margin-bottom: 10px;
        }

        .error-steps ol {
            font-size: 12px;
            color: #94a3b8;
            padding-left: 20px;
        }

        .error-steps li {
            margin-bottom: 6px;
            line-height: 1.5;
        }

        .error-steps code {
            background: rgba(124, 58, 237, 0.2);
            padding: 2px 6px;
            border-radius: 4px;
            color: #a78bfa;
            font-size: 11px;
        }

        .error-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .error-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .error-btn-primary {
            background: linear-gradient(135deg, #7c3aed, #00d4ff);
            color: #fff;
        }

        .error-btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.4);
        }

        .error-btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .error-btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .error-close {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 30px;
            height: 30px;
            border: none;
            background: transparent;
            color: #64748b;
            font-size: 20px;
            cursor: pointer;
            border-radius: 50%;
            transition: all 0.2s;
        }

        .error-close:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .legend {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(10, 10, 30, 0.9);
            padding: 15px 20px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .legend h3 {
            font-size: 14px;
            margin-bottom: 12px;
            color: #94a3b8;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            font-size: 12px;
        }

        .legend-line {
            width: 30px;
            height: 3px;
            border-radius: 2px;
        }

        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .refresh-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 100;
            padding: 12px 24px;
            background: linear-gradient(135deg, #7c3aed, #00d4ff);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.4);
        }

        .refresh-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 150;
            text-align: center;
        }

        .loading.show {
            display: block;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #7c3aed;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: #94a3b8;
            font-size: 14px;
        }

        .mapboxgl-popup {
            max-width: 280px;
        }

        .mapboxgl-popup-content {
            background: rgba(10, 10, 30, 0.95);
            color: #fff;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px;
        }

        .mapboxgl-popup-close-button {
            color: #fff;
            font-size: 20px;
        }

        .amap-info-content {
            background: rgba(10, 10, 30, 0.95) !important;
            color: #fff !important;
            border-radius: 10px !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            padding: 15px !important;
        }

        .popup-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #00d4ff;
        }

        .popup-item {
            font-size: 13px;
            margin-bottom: 6px;
            color: #94a3b8;
        }

        .popup-item span {
            color: #fff;
            font-weight: 500;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .hidden {
            display: none !important;
        }

        .gaode-marker-label {
            background: rgba(124, 58, 237, 0.9);
            color: #fff;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            white-space: nowrap;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .toast-container {
            position: fixed;
            top: 80px;
            right: 30px;
            z-index: 300;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        .toast {
            position: relative;
            padding: 14px 16px;
            background: rgba(10, 10, 30, 0.95);
            border-radius: 10px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            font-size: 14px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            pointer-events: auto;
            min-width: 280px;
            max-width: 380px;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.3s ease, transform 0.3s ease, margin 0.3s ease;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .toast.hide {
            opacity: 0;
            transform: translateX(30px);
        }

        .toast.success {
            border-left: 3px solid #22c55e;
        }

        .toast.error {
            border-left: 3px solid #ef4444;
        }

        .toast.warning {
            border-left: 3px solid #eab308;
        }

        .toast.info {
            border-left: 3px solid #3b82f6;
        }

        .toast-icon {
            font-size: 20px;
            flex-shrink: 0;
            margin-top: -1px;
        }

        .toast-body {
            flex: 1;
            min-width: 0;
        }

        .toast-title {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 4px;
            color: #f1f5f9;
        }

        .toast-message {
            font-size: 12px;
            color: #94a3b8;
            line-height: 1.5;
            word-break: break-word;
        }

        .toast-tips {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 12px;
            color: #64748b;
            line-height: 1.6;
        }

        .toast-tips-title {
            font-weight: 500;
            color: #94a3b8;
            margin-bottom: 4px;
        }

        .toast-tips ul {
            margin: 0;
            padding-left: 16px;
        }

        .toast-tips li {
            margin-bottom: 2px;
        }

        .toast-detail {
            display: none;
            margin-top: 8px;
            padding: 8px 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 6px;
            font-family: monospace;
            font-size: 11px;
            color: #f87171;
            max-height: 120px;
            overflow-y: auto;
            word-break: break-all;
            white-space: pre-wrap;
        }

        .toast-detail.show {
            display: block;
        }

        .toast-actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .toast-action-btn {
            padding: 4px 10px;
            font-size: 12px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            color: #94a3b8;
            cursor: pointer;
            transition: all 0.2s;
        }

        .toast-action-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        .toast-action-btn.primary {
            background: rgba(124, 58, 237, 0.3);
            border-color: rgba(124, 58, 237, 0.5);
            color: #a78bfa;
        }

        .toast-action-btn.primary:hover {
            background: rgba(124, 58, 237, 0.5);
            color: #c4b5fd;
        }

        .toast-close {
            background: none;
            border: none;
            color: #64748b;
            font-size: 18px;
            cursor: pointer;
            padding: 0 2px;
            line-height: 1;
            flex-shrink: 0;
        }

        .toast-close:hover {
            color: #fff;
        }

        .toast-progress {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 2px;
            background: linear-gradient(90deg, #7c3aed, #00d4ff);
            border-radius: 0 0 10px 10px;
            transition: width 0.1s linear;
        }

        .toast:hover .toast-progress {
            animation-play-state: paused;
        }

        .toast-retry-progress {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            font-size: 12px;
            color: #fbbf24;
        }

        .toast-retry-spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(251, 191, 36, 0.3);
            border-top-color: #fbbf24;
            border-radius: 50%;
            animation: toastRetrySpin 1s linear infinite;
        }

        @keyframes toastRetrySpin {
            to { transform: rotate(360deg); }
        }

        .toast-retry-countdown {
            font-variant-numeric: tabular-nums;
            min-width: 30px;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="gaode-map"></div>
    
    <div id="toast-container" class="toast-container"></div>
    
    <div id="map-fallback" class="map-fallback hidden">
        <svg viewBox="0 0 100 100" preserveAspectRatio="none">
            <defs>
                <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.1" />
                    <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:0" />
                </radialGradient>
            </defs>
            <rect width="100" height="100" fill="url(#bgGrad)"/>
            <circle cx="50" cy="50" r="1" fill="#00d4ff" opacity="0.5"/>
            <circle cx="50" cy="50" r="15" fill="none" stroke="#7c3aed" stroke-width="0.1" opacity="0.3"/>
            <circle cx="50" cy="50" r="30" fill="none" stroke="#7c3aed" stroke-width="0.1" opacity="0.2"/>
            <circle cx="50" cy="50" r="45" fill="none" stroke="#7c3aed" stroke-width="0.1" opacity="0.1"/>
        </svg>
        <div class="map-fallback-content">
            <div class="map-fallback-icon">🗺️</div>
            <div class="map-fallback-title">备用可视化模式</div>
            <div class="map-fallback-subtitle">地图服务不可用，以下为简化展示</div>
            <div id="fallback-directions" class="fallback-directions-grid"></div>
        </div>
    </div>

    <div class="header">
        <h1>🚗 周末出行指南</h1>
        <div class="subtitle">实时出城车流分析与热门目的地推荐</div>
        <div class="time-info">
            <span id="current-time">加载中...</span>
            <span id="flow-indicator" class="flow-indicator flow-outbound">出城方向</span>
        </div>
    </div>

    <div id="map-status" class="map-status">
        <div class="map-status-dot loading"></div>
        <span id="map-status-text">正在加载地图...</span>
    </div>

    <div class="sidebar">
        <div class="sidebar-header">
            <h2>热门出行方向</h2>
            <p>基于实时交通拥堵数据分析</p>
        </div>
        <div id="direction-list" class="direction-list">
        </div>
    </div>

    <div id="error-panel" class="error-panel">
        <button class="error-close" onclick="closeErrorPanel()">×</button>
        <div class="error-icon">⚠️</div>
        <div id="error-title" class="error-title">地图加载失败</div>
        <div id="error-message" class="error-message"></div>
        <div class="error-steps">
            <h4>🔧 解决方法：</h4>
            <ol>
                <li>检查网络连接是否正常</li>
                <li>在 <code>.env</code> 中配置 <code>MAPBOX_TOKEN</code> 使用 Mapbox 地图</li>
                <li>或配置 <code>GAODE_TRAFFIC_KEY</code> 使用高德地图</li>
                <li>点击「使用备用方案」查看简化版可视化</li>
            </ol>
        </div>
        <div class="error-actions">
            <button class="error-btn error-btn-primary" onclick="retryMapLoad()">🔄 重试加载</button>
            <button class="error-btn error-btn-secondary" onclick="tryGaodeMap()">📍 尝试高德地图</button>
            <button class="error-btn error-btn-secondary" onclick="useFallbackMap()">📊 备用方案</button>
        </div>
    </div>

    <div class="legend">
        <h3>图例</h3>
        <div class="legend-item">
            <div class="legend-line" style="background: linear-gradient(90deg, #00d4ff, #7c3aed); width: 60px; height: 8px;"></div>
            <span>车流量大</span>
        </div>
        <div class="legend-item">
            <div class="legend-line" style="background: linear-gradient(90deg, #00d4ff, #7c3aed); width: 30px; height: 4px;"></div>
            <span>车流量小</span>
        </div>
        <div style="height: 10px;"></div>
        <div class="legend-item">
            <div class="legend-dot" style="background: #22c55e;"></div>
            <span>畅通</span>
        </div>
        <div class="legend-item">
            <div class="legend-dot" style="background: #eab308;"></div>
            <span>缓行</span>
        </div>
        <div class="legend-item">
            <div class="legend-dot" style="background: #f97316;"></div>
            <span>拥堵</span>
        </div>
        <div class="legend-item">
            <div class="legend-dot" style="background: #ef4444;"></div>
            <span>严重拥堵</span>
        </div>
    </div>

    <button id="refresh-btn" class="refresh-btn" onclick="refreshData()">
        🔄 刷新数据
    </button>

    <div id="loading" class="loading">
        <div class="loading-spinner"></div>
        <div class="loading-text">正在分析交通数据...</div>
    </div>

    <script>
        let map;
        let gaodeMap;
        let gaodePolylines = [];
        let gaodeMarkers = [];
        let currentData = null;
        let mapLoadTimeout = null;
        let isUsingFallback = false;
        let currentMapProvider = null;
        let mapLoadAttempts = 0;
        let appConfig = null;
        let isMapInitialized = false;
        const MAX_LOAD_ATTEMPTS = 2;
        const MAX_TOAST_COUNT = 3;
        const MAX_FETCH_RETRIES = 3;
        const RETRY_DELAY = 1000;

        const toastQueue = [];
        const activeToasts = [];

        const errorTipsMap = {
            network: {
                title: '解决建议',
                tips: [
                    '检查 WiFi 或移动数据是否已连接',
                    '尝试切换网络环境后重试',
                    '确认服务器是否正常运行'
                ]
            },
            server: {
                title: '解决建议',
                tips: [
                    '服务器暂时繁忙，请稍后再试',
                    '可以点击「刷新数据」按钮手动重试',
                    '如持续出现请联系管理员'
                ]
            },
            notfound: {
                title: '解决建议',
                tips: [
                    '请求的接口不存在',
                    '请检查页面版本是否最新',
                    '尝试刷新页面后重试'
                ]
            },
            config: {
                title: '解决建议',
                tips: [
                    '请检查 .env 配置文件',
                    '确认 GAODE_TRAFFIC_KEY 是否正确配置',
                    '配置完成后重启服务'
                ]
            }
        };

        function getErrorTipType(errorMessage) {
            const msg = errorMessage.toLowerCase();
            if (msg.includes('failed to fetch') || msg.includes('networkerror') || msg.includes('network')) {
                return 'network';
            }
            if (msg.includes('http 50') || msg.includes('server')) {
                return 'server';
            }
            if (msg.includes('http 404') || msg.includes('not found')) {
                return 'notfound';
            }
            if (msg.includes('config') || msg.includes('token') || msg.includes('key')) {
                return 'config';
            }
            return null;
        }

        function showToast(options) {
            if (typeof options === 'string') {
                options = { type: 'info', title: arguments[0], message: arguments[1], duration: arguments[2] || 3000 };
            }

            const {
                type = 'info',
                title,
                message = '',
                duration = 3000,
                detail = null,
                tipType = null,
                actions = [],
                showProgress = true,
                onClose = null
            } = options;

            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;

            const icons = {
                success: '✅',
                error: '❌',
                warning: '⚠️',
                info: 'ℹ️'
            };

            const tipInfo = tipType ? errorTipsMap[tipType] : null;
            const hasDetail = detail !== null;
            const hasTips = tipInfo !== null;
            const hasActions = actions && actions.length > 0;

            let tipsHtml = '';
            if (hasTips) {
                tipsHtml = `
                    <div class="toast-tips">
                        <div class="toast-tips-title">${tipInfo.title}</div>
                        <ul>
                            ${tipInfo.tips.map(tip => `<li>${tip}</li>`).join('')}
                        </ul>
                    </div>
                `;
            }

            toast.innerHTML = `
                <div class="toast-icon">${icons[type] || 'ℹ️'}</div>
                <div class="toast-body">
                    <div class="toast-title">${title}</div>
                    ${message ? `<div class="toast-message">${message}</div>` : ''}
                    ${tipsHtml}
                    ${hasDetail ? `
                        <div class="toast-actions">
                            <button class="toast-action-btn" data-toggle-detail>查看详情</button>
                        </div>
                        <div class="toast-detail"></div>
                    ` : ''}
                    ${hasActions ? `<div class="toast-actions">
                        ${actions.map((action, idx) =>
                            `<button class="toast-action-btn ${action.primary ? 'primary' : ''}" data-action="${idx}">${action.label}</button>`
                        ).join('')}
                    </div>` : ''}
                </div>
                <button class="toast-close" data-close>×</button>
                ${showProgress && duration > 0 ? '<div class="toast-progress"></div>' : ''}
            `;

            const toastData = {
                element: toast,
                duration,
                remainingTime: duration,
                startTime: null,
                timer: null,
                progressEl: null,
                isPaused: false,
                onClose
            };

            toast.dataset.toastId = Date.now() + Math.random();

            toast.querySelector('[data-close]').addEventListener('click', () => {
                removeToast(toastData);
            });

            if (hasDetail) {
                const detailBtn = toast.querySelector('[data-toggle-detail]');
                const detailEl = toast.querySelector('.toast-detail');
                detailEl.textContent = detail;
                detailBtn.addEventListener('click', () => {
                    detailEl.classList.toggle('show');
                    detailBtn.textContent = detailEl.classList.contains('show') ? '收起详情' : '查看详情';
                });
            }

            if (hasActions && actions) {
                toast.querySelectorAll('[data-action]').forEach(btn => {
                    const idx = parseInt(btn.dataset.action);
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        if (actions[idx].onClick) {
                            actions[idx].onClick(toastData);
                        }
                    });
                });
            }

            toast.addEventListener('mouseenter', () => {
                pauseToast(toastData);
            });
            toast.addEventListener('mouseleave', () => {
                resumeToast(toastData);
            });

            container.appendChild(toast);
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    toast.classList.add('show');
                });
            });

            manageToastQueue(toastData);

            if (duration > 0) {
                startToastTimer(toastData);
            }

            toastData.progressEl = toast.querySelector('.toast-progress');
            if (toastData.progressEl) {
                toastData.progressEl.style.width = '100%';
                toastData.progressEl.style.transition = `width ${duration}ms linear`;
                requestAnimationFrame(() => {
                    toastData.progressEl.style.width = '0%';
                });
            }

            return toastData;
        }

        function manageToastQueue(newToast) {
            activeToasts.push(newToast);

            if (activeToasts.length > MAX_TOAST_COUNT) {
                const oldest = activeToasts.shift();
                removeToast(oldest, true);
            }
        }

        function startToastTimer(toastData) {
            toastData.startTime = Date.now();
            toastData.timer = setTimeout(() => {
                removeToast(toastData);
            }, toastData.remainingTime);
        }

        function pauseToast(toastData) {
            if (toastData.isPaused || !toastData.timer) return;
            toastData.isPaused = true;
            clearTimeout(toastData.timer);
            toastData.remainingTime -= Date.now() - toastData.startTime;

            if (toastData.progressEl) {
                const computedStyle = getComputedStyle(toastData.progressEl);
                toastData.progressEl.style.width = computedStyle.width;
                toastData.progressEl.style.transition = 'none';
            }
        }

        function resumeToast(toastData) {
            if (!toastData.isPaused || toastData.remainingTime <= 0) return;
            toastData.isPaused = false;
            toastData.startTime = Date.now();
            toastData.timer = setTimeout(() => {
                removeToast(toastData);
            }, toastData.remainingTime);

            if (toastData.progressEl) {
                requestAnimationFrame(() => {
                    toastData.progressEl.style.transition = `width ${toastData.remainingTime}ms linear`;
                    toastData.progressEl.style.width = '0%';
                });
            }
        }

        function removeToast(toastData, immediate = false) {
            if (!toastData.element || toastData.removed) return;
            toastData.removed = true;

            const idx = activeToasts.indexOf(toastData);
            if (idx > -1) {
                activeToasts.splice(idx, 1);
            }

            if (toastData.timer) {
                clearTimeout(toastData.timer);
            }

            if (immediate) {
                toastData.element.remove();
            } else {
                toastData.element.classList.add('hide');
                toastData.element.classList.remove('show');
                setTimeout(() => {
                    if (toastData.element.parentNode) {
                        toastData.element.remove();
                    }
                }, 300);
            }

            if (toastData.onClose) {
                toastData.onClose();
            }
        }

        function updateToastMessage(toastData, message, title = null) {
            if (!toastData.element) return;
            const messageEl = toastData.element.querySelector('.toast-message');
            if (messageEl && message !== undefined) {
                messageEl.textContent = message;
            }
            if (title !== null) {
                const titleEl = toastData.element.querySelector('.toast-title');
                if (titleEl) titleEl.textContent = title;
            }
        }

        async function fetchWithRetry(url, options = {}, maxRetries = MAX_FETCH_RETRIES, retryDelay = RETRY_DELAY, onRetry = null, onCountdown = null) {
            let lastError;
            
            for (let attempt = 1; attempt <= maxRetries; attempt++) {
                try {
                    const response = await fetch(url, options);
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }
                    return response;
                } catch (error) {
                    lastError = error;
                    console.warn(`Fetch attempt ${attempt}/${maxRetries} failed:`, error.message);
                    
                    if (attempt < maxRetries) {
                        if (onRetry) {
                            onRetry(attempt, maxRetries, error);
                        }
                        
                        const delay = retryDelay * attempt;
                        
                        if (onCountdown) {
                            let remaining = delay;
                            const tick = 100;
                            const interval = setInterval(() => {
                                remaining -= tick;
                                if (remaining <= 0) {
                                    clearInterval(interval);
                                } else {
                                    onCountdown(remaining, attempt, maxRetries);
                                }
                            }, tick);
                        }
                        
                        await new Promise(resolve => setTimeout(resolve, delay));
                    }
                }
            }
            
            throw lastError;
        }

        const directionArrows = {
            '北': '↑',
            '东北': '↗',
            '东': '→',
            '东南': '↘',
            '南': '↓',
            '西南': '↙',
            '西': '←',
            '西北': '↖'
        };

        function getDirectionArrow(direction) {
            return directionArrows[direction] || '●';
        }

        function getCongestionColor(level) {
            if (level <= 1) return '#22c55e';
            if (level <= 2) return '#eab308';
            if (level <= 3) return '#f97316';
            return '#ef4444';
        }

        function getCongestionText(level) {
            if (level <= 1) return '畅通';
            if (level <= 2) return '缓行';
            if (level <= 3) return '拥堵';
            return '严重拥堵';
        }

        function updateMapStatus(status, text, showSwitch = false) {
            const statusEl = document.getElementById('map-status');
            const dotEl = statusEl.querySelector('.map-status-dot');
            const textEl = document.getElementById('map-status-text');
            
            dotEl.className = 'map-status-dot ' + status;
            textEl.textContent = text;
            
            let switchBtn = statusEl.querySelector('.map-switch-btn');
            if (showSwitch) {
                if (!switchBtn) {
                    switchBtn = document.createElement('button');
                    switchBtn.className = 'map-switch-btn';
                    switchBtn.onclick = cycleMapMode;
                    statusEl.appendChild(switchBtn);
                }
                switchBtn.textContent = getNextModeLabel();
            } else if (switchBtn) {
                switchBtn.remove();
            }
        }

        function getNextModeLabel() {
            if (currentMapProvider === 'mapbox') return '切换到高德';
            if (currentMapProvider === 'gaode') return '切换到备用';
            if (appConfig && isValidGaodeKey(appConfig.gaode_key)) return '切换到高德';
            return '切换到地图';
        }

        function cycleMapMode() {
            if (currentMapProvider === 'mapbox') {
                switchToGaodeMap();
            } else if (currentMapProvider === 'gaode') {
                useFallbackMap();
            } else {
                if (appConfig && isValidGaodeKey(appConfig.gaode_key)) {
                    switchToGaodeMap();
                } else {
                    initMap();
                }
            }
        }

        function showErrorPanel(title, message) {
            document.getElementById('error-title').textContent = title;
            document.getElementById('error-message').textContent = message;
            document.getElementById('error-panel').classList.add('show');
            updateMapStatus('error', '地图加载失败');
        }

        function closeErrorPanel() {
            document.getElementById('error-panel').classList.remove('show');
        }

        function hideAllMaps() {
            document.getElementById('map-fallback').classList.add('hidden');
            document.getElementById('gaode-map').style.display = 'none';
            if (map) {
                map.remove();
                map = null;
            }
            if (gaodeMap) {
                gaodeMap.destroy();
                gaodeMap = null;
            }
            gaodePolylines = [];
            gaodeMarkers = [];
            currentMapProvider = null;
            isUsingFallback = false;
            isMapInitialized = false;
        }

        function useFallbackMap() {
            closeErrorPanel();
            hideAllMaps();
            isUsingFallback = true;
            currentMapProvider = 'fallback';
            document.getElementById('map-fallback').classList.remove('hidden');
            updateMapStatus('fallback', '备用可视化模式', true);
            
            if (currentData) {
                renderFallbackDirections(currentData);
            }
        }

        function renderFallbackDirections(data) {
            const container = document.getElementById('fallback-directions');
            container.innerHTML = '';
            
            data.radial_lines.slice(0, 6).forEach((line, idx) => {
                const card = document.createElement('div');
                card.className = 'fallback-direction-card';
                card.onclick = () => {
                    document.querySelectorAll('.direction-item').forEach((item, i) => {
                        item.classList.toggle('active', i === idx);
                    });
                };
                card.innerHTML = `
                    <div class="fallback-direction-arrow">${getDirectionArrow(line.direction)}</div>
                    <div class="fallback-direction-name">${line.direction}</div>
                    <div class="fallback-direction-dest">${line.destination || '热门方向'}</div>
                `;
                container.appendChild(card);
            });
        }

        function retryMapLoad() {
            closeErrorPanel();
            mapLoadAttempts++;
            
            if (mapLoadAttempts >= MAX_LOAD_ATTEMPTS) {
                showErrorPanel(
                    'Mapbox 加载失败',
                    `已尝试加载 ${MAX_LOAD_ATTEMPTS} 次，可以尝试使用高德地图或备用方案。`
                );
                return;
            }
            
            updateMapStatus('loading', `正在重试 (${mapLoadAttempts}/${MAX_LOAD_ATTEMPTS})...`);
            initMap();
        }

        function tryGaodeMap() {
            closeErrorPanel();
            switchToGaodeMap();
        }

        function updateTime() {
            const now = new Date();
            const timeStr = now.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
            document.getElementById('current-time').textContent = timeStr;
        }

        function isValidGaodeKey(key) {
            return key && !key.includes('your_') && key.length > 10;
        }

        function isValidMapboxToken(token) {
            return token && !token.includes('your_') && token.length > 20 && token.startsWith('pk.');
        }

        function loadGaodeSDK(callback) {
            if (window.AMap) {
                callback();
                return;
            }

            const key = appConfig.gaode_key;
            const script = document.createElement('script');
            script.src = `https://webapi.amap.com/maps?v=2.0&key=${key}`;
            script.onload = callback;
            script.onerror = () => {
                console.error('高德地图 SDK 加载失败');
                showErrorPanel(
                    '高德地图加载失败',
                    '无法加载高德地图 SDK，请检查网络连接或 API Key 配置。'
                );
                useFallbackMap();
            };
            document.head.appendChild(script);
        }

        function switchToGaodeMap() {
            if (!appConfig || !isValidGaodeKey(appConfig.gaode_key)) {
                showErrorPanel(
                    '高德地图未配置',
                    '未检测到有效的高德地图 API Key，请在 .env 中配置 GAODE_TRAFFIC_KEY。'
                );
                return;
            }

            hideAllMaps();
            updateMapStatus('loading', '正在加载高德地图...');

            loadGaodeSDK(() => {
                try {
                    const [lng, lat] = appConfig.city_center;
                    document.getElementById('gaode-map').style.display = 'block';
                    
                    gaodeMap = new AMap.Map('gaode-map', {
                        zoom: 10,
                        center: [lng, lat],
                        mapStyle: 'amap://styles/darkblue',
                        viewMode: '3D',
                        pitch: 40
                    });

                    gaodeMap.on('complete', () => {
                        currentMapProvider = 'gaode';
                        updateMapStatus('success', '高德地图加载成功', true);
                        if (currentData) {
                            renderGaodeLayers(currentData);
                        }
                    });

                    gaodeMap.on('error', (e) => {
                        console.error('高德地图错误:', e);
                        showErrorPanel(
                            '高德地图渲染错误',
                            '地图渲染时发生错误，请检查 API Key 权限。'
                        );
                        useFallbackMap();
                    });

                } catch (error) {
                    console.error('高德地图初始化失败:', error);
                    showErrorPanel(
                        '高德地图初始化失败',
                        error.message || '无法初始化高德地图。'
                    );
                    useFallbackMap();
                }
            });
        }

        function renderGaodeLayers(data) {
            if (!gaodeMap) return;

            gaodePolylines.forEach(line => line.setMap(null));
            gaodeMarkers.forEach(marker => marker.setMap(null));
            gaodePolylines = [];
            gaodeMarkers = [];

            const maxVolume = Math.max(...data.radial_lines.map(l => l.flow_volume), 1);

            data.radial_lines.forEach((line, index) => {
                const path = [line.start, line.end];
                const color = getCongestionColor(line.avg_congestion);
                const normalizedWidth = Math.max(3, Math.min(15, (line.flow_volume / maxVolume) * 12));

                const glowLine = new AMap.Polyline({
                    path: path,
                    strokeColor: color,
                    strokeWeight: normalizedWidth * 2.5,
                    strokeOpacity: 0.2,
                    strokeStyle: 'solid',
                    lineJoin: 'round',
                    lineCap: 'round'
                });
                glowLine.setMap(gaodeMap);
                gaodePolylines.push(glowLine);

                const polyline = new AMap.Polyline({
                    path: path,
                    strokeColor: color,
                    strokeWeight: normalizedWidth,
                    strokeOpacity: 0.85,
                    strokeStyle: 'solid',
                    lineJoin: 'round',
                    lineCap: 'round'
                });
                polyline.setMap(gaodeMap);
                gaodePolylines.push(polyline);

                polyline.on('click', () => {
                    const content = `
                        <div class="popup-title">${line.direction}方向</div>
                        <div class="popup-item">目的地: <span>${line.destination || '分析中'}</span></div>
                        <div class="popup-item">车流量: <span>${line.flow_volume} 段</span></div>
                        <div class="popup-item">车流占比: <span>${line.flow_percentage.toFixed(1)}%</span></div>
                        <div class="popup-item">拥堵状况: <span>${getCongestionText(line.avg_congestion)}</span></div>
                    `;
                    const infoWindow = new AMap.InfoWindow({
                        content: content,
                        offset: new AMap.Pixel(0, -30)
                    });
                    infoWindow.open(gaodeMap, line.end);
                });

                if (line.destination) {
                    const marker = new AMap.Marker({
                        position: line.end,
                        title: line.destination,
                        anchor: 'bottom-center'
                    });

                    const labelContent = `
                        <div class="gaode-marker-label">
                            🏛️ ${line.destination}
                        </div>
                    `;
                    const labelMarker = new AMap.Text({
                        text: line.destination,
                        position: [line.end[0], line.end[1] - 0.02],
                        style: {
                            'background-color': 'rgba(124, 58, 237, 0.9)',
                            'color': '#fff',
                            'padding': '4px 10px',
                            'border-radius': '4px',
                            'font-size': '12px',
                            'border': '1px solid rgba(255,255,255,0.3)',
                            'text-align': 'center'
                        },
                        anchor: 'bottom-center'
                    });
                    labelMarker.setMap(gaodeMap);
                    gaodeMarkers.push(labelMarker);

                    marker.setMap(gaodeMap);
                    gaodeMarkers.push(marker);

                    marker.on('click', () => {
                        const content = `
                            <div class="popup-title">🏛️ ${line.destination}</div>
                            <div class="popup-item">等级: <span>${line.destination_level || '知名景区'}</span></div>
                            <div class="popup-item">方向: <span>${line.direction}</span></div>
                        `;
                        const infoWindow = new AMap.InfoWindow({
                            content: content,
                            offset: new AMap.Pixel(0, -30)
                        });
                        infoWindow.open(gaodeMap, line.end);
                    });
                }
            });

            const centerMarker = new AMap.Marker({
                position: appConfig.city_center,
                title: '城市中心',
                anchor: 'center'
            });
            centerMarker.setMap(gaodeMap);
            gaodeMarkers.push(centerMarker);
        }

        async function initMap() {
            if (mapLoadTimeout) {
                clearTimeout(mapLoadTimeout);
            }

            hideAllMaps();
            mapLoadAttempts = 0;
            updateMapStatus('loading', '正在加载 Mapbox 地图...');

            mapLoadTimeout = setTimeout(() => {
                if (isMapInitialized) return;
                if (!map) {
                    console.warn('Mapbox 加载超时，尝试高德地图...');
                    if (appConfig && isValidGaodeKey(appConfig.gaode_key)) {
                        isMapInitialized = true;
                        switchToGaodeMap();
                    } else {
                        showErrorPanel(
                            '地图加载超时',
                            'Mapbox 地图加载超时，且未配置高德地图 Key。'
                        );
                        isMapInitialized = true;
                        useFallbackMap();
                    }
                }
            }, 10000);

            try {
                const configResponse = await fetch('/api/config');
                if (!configResponse.ok) {
                    throw new Error('配置获取失败');
                }
                appConfig = await configResponse.json();

                const token = appConfig.mapbox_token;
                const hasValidToken = isValidMapboxToken(token);

                if (!hasValidToken) {
                    clearTimeout(mapLoadTimeout);
                    console.warn('Mapbox Token 未配置，尝试高德地图...');
                    
                    if (isValidGaodeKey(appConfig.gaode_key)) {
                        isMapInitialized = true;
                        switchToGaodeMap();
                        fetchTrafficData();
                        return;
                    }
                    
                    console.warn('高德 Key 也未配置，使用备用方案');
                    isMapInitialized = true;
                    useFallbackMap();
                    fetchTrafficData();
                    return;
                }

                mapboxgl.accessToken = token;

                map = new mapboxgl.Map({
                    container: 'map',
                    style: 'mapbox://styles/mapbox/dark-v11',
                    center: appConfig.city_center,
                    zoom: 9,
                    pitch: 40
                });

                map.on('error', (e) => {
                    if (isMapInitialized) return;
                    console.error('Mapbox error:', e);
                    clearTimeout(mapLoadTimeout);
                    
                    if (appConfig && isValidGaodeKey(appConfig.gaode_key)) {
                        console.warn('Mapbox 出错，切换到高德地图...');
                        isMapInitialized = true;
                        switchToGaodeMap();
                    } else {
                        showErrorPanel(
                            '地图渲染错误',
                            e.error?.message || '地图加载时发生未知错误。'
                        );
                        isMapInitialized = true;
                        useFallbackMap();
                    }
                });

                map.on('style.load', () => {
                    if (isMapInitialized) return;
                    clearTimeout(mapLoadTimeout);
                    isMapInitialized = true;
                    currentMapProvider = 'mapbox';
                    updateMapStatus('success', 'Mapbox 地图加载成功', true);
                    fetchTrafficData();
                });

                map.on('load', () => {
                    map.addControl(new mapboxgl.NavigationControl(), 'top-right');
                });

            } catch (error) {
                clearTimeout(mapLoadTimeout);
                console.error('Failed to initialize map:', error);
                
                if (appConfig && isValidGaodeKey(appConfig.gaode_key)) {
                    switchToGaodeMap();
                } else {
                    showErrorPanel(
                        '地图初始化失败',
                        error.message || '无法加载地图资源。'
                    );
                    useFallbackMap();
                }
            }
        }

        async function fetchTrafficData(isManualRefresh = false) {
            showLoading(true);
            
            let loadingToast = null;
            
            if (isManualRefresh) {
                loadingToast = showToast({
                    type: 'info',
                    title: '正在加载数据...',
                    message: '正在获取交通流分析数据，请稍候',
                    duration: 0
                });
            }
            
            try {
                const response = await fetchWithRetry(
                    '/api/traffic/flow?use_mock=true',
                    {},
                    MAX_FETCH_RETRIES,
                    RETRY_DELAY,
                    (attempt, maxRetries, error) => {
                        if (loadingToast) {
                            removeToast(loadingToast);
                            loadingToast = null;
                        }
                        
                        const delaySeconds = ((attempt + 1) * RETRY_DELAY / 1000).toFixed(1);
                        loadingToast = showToast({
                            type: 'warning',
                            title: `重试中 (${attempt}/${maxRetries})`,
                            message: `第 ${attempt} 次请求失败，${delaySeconds}秒后进行第 ${attempt + 1} 次重试`,
                            duration: 0,
                            tipType: getErrorTipType(error.message)
                        });
                    },
                    (remainingMs, attempt, maxRetries) => {
                        if (loadingToast && loadingToast.element) {
                            const messageEl = loadingToast.element.querySelector('.toast-message');
                            if (messageEl) {
                                const seconds = (remainingMs / 1000).toFixed(1);
                                messageEl.textContent = `第 ${attempt} 次请求失败，${seconds}秒后进行第 ${attempt + 1} 次重试`;
                            }
                        }
                    }
                );
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                currentData = await response.json();
                updateUI(currentData);
                
                if (currentMapProvider === 'mapbox' && map) {
                    renderMapLayers(currentData);
                } else if (currentMapProvider === 'gaode' && gaodeMap) {
                    renderGaodeLayers(currentData);
                } else if (isUsingFallback) {
                    renderFallbackDirections(currentData);
                }
                
                if (loadingToast) {
                    removeToast(loadingToast);
                    loadingToast = null;
                }
                
                if (isManualRefresh) {
                    showToast({
                        type: 'success',
                        title: '数据加载成功',
                        message: `已更新 ${currentData.radial_lines.length} 个方向的车流数据`,
                        duration: 2500
                    });
                }
                
            } catch (error) {
                console.error('Failed to fetch traffic data:', error);
                
                if (loadingToast) {
                    removeToast(loadingToast);
                    loadingToast = null;
                }
                
                const errorMessage = error.message || '未知错误';
                const tipType = getErrorTipType(errorMessage);
                
                let userMessage = '请检查网络连接后重试';
                if (errorMessage.includes('Failed to fetch') || errorMessage.includes('NetworkError')) {
                    userMessage = '无法连接到服务器，请检查网络连接';
                } else if (errorMessage.includes('HTTP 500')) {
                    userMessage = '服务器内部错误，请稍后重试';
                } else if (errorMessage.includes('HTTP 404')) {
                    userMessage = '请求的接口不存在';
                }
                
                showToast({
                    type: 'error',
                    title: '数据加载失败',
                    message: userMessage,
                    duration: 8000,
                    detail: `${errorMessage}\n\n请求地址: /api/traffic/flow?use_mock=true\n时间: ${new Date().toLocaleString()}`,
                    tipType: tipType,
                    actions: [
                        {
                            label: '立即重试',
                            primary: true,
                            onClick: (toastData) => {
                                removeToast(toastData);
                                fetchTrafficData(true);
                            }
                        }
                    ]
                });
                
            } finally {
                showLoading(false);
            }
        }

        function updateUI(data) {
            const flowIndicator = document.getElementById('flow-indicator');
            if (data.flow_direction === 'outbound') {
                flowIndicator.textContent = '出城方向';
                flowIndicator.className = 'flow-indicator flow-outbound';
            } else {
                flowIndicator.textContent = '进城方向';
                flowIndicator.className = 'flow-indicator flow-inbound';
            }

            const directionList = document.getElementById('direction-list');
            directionList.innerHTML = '';

            data.radial_lines.forEach((line, index) => {
                const item = document.createElement('div');
                item.className = 'direction-item' + (index === 0 ? ' active' : '');
                item.onclick = () => focusOnDirection(line, index);

                item.innerHTML = `
                    <div class="direction-top">
                        <div class="direction-name">
                            <span class="direction-arrow">${getDirectionArrow(line.direction)}</span>
                            ${line.direction}方向
                        </div>
                        <div class="direction-volume">${line.flow_volume} 段</div>
                    </div>
                    <div class="direction-destination">
                        热门目的地: <span class="destination-name">${line.destination || '待分析'}</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${line.flow_percentage}%"></div>
                    </div>
                    <div class="congestion-indicator">
                        <div class="congestion-dot" style="background: ${getCongestionColor(line.avg_congestion)}"></div>
                        ${getCongestionText(line.avg_congestion)} · ${line.flow_percentage.toFixed(1)}% 车流占比
                    </div>
                `;

                directionList.appendChild(item);
            });
        }

        function renderMapLayers(data) {
            if (!map) return;

            try {
                const style = map.getStyle();
                if (!style || !style.sources) return;

                Object.keys(style.sources).forEach(id => {
                    if (id.startsWith('radial-') || id.startsWith('destination-')) {
                        if (map.getLayer(id + '-line')) map.removeLayer(id + '-line');
                        if (map.getLayer(id + '-glow')) map.removeLayer(id + '-glow');
                        if (map.getLayer(id + '-marker')) map.removeLayer(id + '-marker');
                        map.removeSource(id);
                    }
                });

                data.radial_lines.forEach((line, index) => {
                    const sourceId = `radial-${index}`;
                    
                    map.addSource(sourceId, {
                        type: 'geojson',
                        data: {
                            type: 'Feature',
                            properties: {
                                direction: line.direction,
                                destination: line.destination,
                                flow_volume: line.flow_volume,
                                flow_percentage: line.flow_percentage,
                                congestion: line.avg_congestion
                            },
                            geometry: {
                                type: 'LineString',
                                coordinates: [line.start, line.end]
                            }
                        }
                    });

                    map.addLayer({
                        id: sourceId + '-glow',
                        type: 'line',
                        source: sourceId,
                        layout: {
                            'line-cap': 'round',
                            'line-join': 'round'
                        },
                        paint: {
                            'line-color': getCongestionColor(line.avg_congestion),
                            'line-width': line.line_width * 3,
                            'line-opacity': 0.2
                        }
                    });

                    map.addLayer({
                        id: sourceId + '-line',
                        type: 'line',
                        source: sourceId,
                        layout: {
                            'line-cap': 'round',
                            'line-join': 'round'
                        },
                        paint: {
                            'line-color': getCongestionColor(line.avg_congestion),
                            'line-width': line.line_width
                        }
                    }, sourceId + '-glow');

                    if (line.destination) {
                        const destSourceId = `destination-${index}`;
                        map.addSource(destSourceId, {
                            type: 'geojson',
                            data: {
                                type: 'Feature',
                                properties: {
                                    name: line.destination,
                                    level: line.destination_level || ''
                                },
                                geometry: {
                                    type: 'Point',
                                    coordinates: line.end
                                }
                            }
                        });

                        map.addLayer({
                            id: destSourceId + '-marker',
                            type: 'circle',
                            source: destSourceId,
                            paint: {
                                'circle-radius': 10,
                                'circle-color': '#7c3aed',
                                'circle-stroke-width': 3,
                                'circle-stroke-color': '#fff',
                                'circle-opacity': 0.9
                            }
                        });

                        map.on('click', destSourceId + '-marker', (e) => {
                            if (!e.features || e.features.length === 0) return;
                            const props = e.features[0].properties;
                            new mapboxgl.Popup()
                                .setLngLat(e.lngLat)
                                .setHTML(`
                                    <div class="popup-title">🏛️ ${props.name}</div>
                                    <div class="popup-item">等级: <span>${props.level}</span></div>
                                `)
                                .addTo(map);
                        });

                        map.on('mouseenter', destSourceId + '-marker', () => {
                            map.getCanvas().style.cursor = 'pointer';
                        });

                        map.on('mouseleave', destSourceId + '-marker', () => {
                            map.getCanvas().style.cursor = '';
                        });
                    }

                    map.on('click', sourceId + '-line', (e) => {
                        if (!e.features || e.features.length === 0) return;
                        const props = e.features[0].properties;
                        new mapboxgl.Popup()
                            .setLngLat(e.lngLat)
                            .setHTML(`
                                <div class="popup-title">${props.direction}方向</div>
                                <div class="popup-item">目的地: <span>${props.destination || '分析中'}</span></div>
                                <div class="popup-item">车流量: <span>${props.flow_volume} 段</span></div>
                                <div class="popup-item">车流占比: <span>${props.flow_percentage.toFixed(1)}%</span></div>
                                <div class="popup-item">拥堵状况: <span>${getCongestionText(props.congestion)}</span></div>
                            `)
                            .addTo(map);
                    });
                });
            } catch (error) {
                console.error('Error rendering map layers:', error);
            }
        }

        function focusOnDirection(line, index) {
            if (currentMapProvider === 'mapbox' && map) {
                map.flyTo({
                    center: line.end,
                    zoom: 11,
                    duration: 1000
                });
            } else if (currentMapProvider === 'gaode' && gaodeMap) {
                gaodeMap.setZoomAndCenter(12, line.end);
            }

            document.querySelectorAll('.direction-item').forEach((item, i) => {
                item.classList.toggle('active', i === index);
            });
        }

        function showLoading(show) {
            const loading = document.getElementById('loading');
            const btn = document.getElementById('refresh-btn');
            loading.classList.toggle('show', show);
            btn.disabled = show;
        }

        function refreshData() {
            fetchTrafficData(true);
        }

        setInterval(updateTime, 1000);
        updateTime();

        updateMapStatus('loading', '正在初始化...');
        initMap();
    </script>
</body>
</html>
