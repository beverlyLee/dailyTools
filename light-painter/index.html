<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Light Painter 3D · 光绘画板</title>
    <style>
      html, body, #app {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #050510;
      }
      canvas {
        display: block;
      }
      .panel {
        position: fixed;
        top: 20px;
        left: 20px;
        background: rgba(15, 15, 30, 0.85);
        border: 1px solid rgba(100, 100, 200, 0.3);
        border-radius: 12px;
        padding: 16px;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        backdrop-filter: blur(10px);
        z-index: 100;
        min-width: 200px;
      }
      .panel-title {
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 12px;
        color: rgba(255, 255, 255, 0.9);
        letter-spacing: 1px;
      }
      .color-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-bottom: 16px;
      }
      .color-btn {
        width: 36px;
        height: 36px;
        border: 2px solid rgba(255, 255, 255, 0.2);
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s;
        padding: 0;
      }
      .color-btn:hover {
        transform: scale(1.1);
        border-color: rgba(255, 255, 255, 0.6);
      }
      .color-btn.active {
        border-color: #fff;
        box-shadow: 0 0 10px currentColor;
      }
      .custom-color {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 16px;
      }
      .custom-color input[type="color"] {
        width: 36px;
        height: 36px;
        border: 2px solid rgba(255, 255, 255, 0.2);
        border-radius: 8px;
        cursor: pointer;
        background: none;
        padding: 0;
      }
      .custom-color span {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.7);
      }
      .depth-control {
        margin-bottom: 16px;
      }
      .depth-control label {
        display: block;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.7);
        margin-bottom: 6px;
      }
      .depth-control input[type="range"] {
        width: 100%;
        accent-color: #6464c8;
      }
      .depth-value {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.5);
        text-align: right;
      }
      .action-buttons {
        display: flex;
        gap: 8px;
      }
      .action-btn {
        flex: 1;
        padding: 8px 12px;
        font-size: 12px;
        border: 1px solid rgba(100, 100, 200, 0.4);
        border-radius: 6px;
        background: rgba(100, 100, 200, 0.2);
        color: #fff;
        cursor: pointer;
        transition: all 0.2s;
      }
      .action-btn:hover {
        background: rgba(100, 100, 200, 0.4);
      }
      .tip {
        position: fixed;
        left: 50%;
        bottom: 20px;
        transform: translateX(-50%);
        color: rgba(255, 255, 255, 0.5);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px;
        letter-spacing: 1px;
        pointer-events: none;
        user-select: none;
        text-align: center;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="panel">
      <div class="panel-title">颜色选择</div>
      <div class="color-grid" id="colorGrid"></div>
      <div class="custom-color">
        <input type="color" id="customColor" value="#ff6666" />
        <span>自定义颜色</span>
      </div>
      <div class="depth-control">
        <label>绘制深度 (Z轴)</label>
        <input type="range" id="depthSlider" min="-5" max="5" step="0.1" value="0" />
        <div class="depth-value" id="depthValue">0.0</div>
      </div>
      <div class="action-buttons">
        <button class="action-btn" id="undoBtn">撤销</button>
        <button class="action-btn" id="clearBtn">清空</button>
      </div>
    </div>
    <div class="tip">
      左键拖动绘制光轨 · 右键拖动旋转视角 · Shift+滚轮调整深度 · 滚轮缩放
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
