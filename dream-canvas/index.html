<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dream Canvas · 粒子梦镜</title>
    <style>
      html, body, #app {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      canvas {
        display: block;
      }
      .tip {
        position: fixed;
        left: 50%;
        bottom: 20px;
        transform: translateX(-50%);
        color: rgba(255, 255, 255, 0.55);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 14px;
        letter-spacing: 2px;
        pointer-events: none;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="tip">移动鼠标 · 感受粒子之梦</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
