<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>菜市场烟火气浓度分析</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: #f5f7fa;
            color: #2c3e50;
        }
        .header {
            background: linear-gradient(135deg, #e74c3c 0%, #f39c12 100%);
            color: white;
            padding: 30px 40px;
            text-align: center;
        }
        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }
        .header p {
            font-size: 14px;
            opacity: 0.9;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .stat-card .label {
            font-size: 13px;
            color: #7f8c8d;
            margin-bottom: 8px;
        }
        .stat-card .value {
            font-size: 28px;
            font-weight: bold;
            color: #2c3e50;
        }
        .stat-card .trend {
            font-size: 12px;
            margin-top: 4px;
        }
        .trend.up { color: #27ae60; }
        .trend.down { color: #e74c3c; }

        .charts-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .chart-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .chart-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #2c3e50;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .chart-title::before {
            content: '';
            width: 4px;
            height: 18px;
            background: #e74c3c;
            border-radius: 2px;
        }
        #sunburst-chart {
            width: 100%;
            height: 500px;
        }
        #bar-chart {
            width: 100%;
            height: 500px;
        }
        .full-width {
            grid-column: 1 / -1;
        }

        .table-section {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #ecf0f1;
        }
        th {
            background: #f8f9fa;
            font-weight: 600;
            font-size: 13px;
            color: #7f8c8d;
        }
        tr:hover {
            background: #f8f9fa;
        }
        .vitality-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }
        .badge-high { background: #fee; color: #e74c3c; }
        .badge-mid-high { background: #fef4e6; color: #e67e22; }
        .badge-mid { background: #fef9e7; color: #f1c40f; }
        .badge-low-mid { background: #e8f4fc; color: #3498db; }
        .badge-low { background: #f0f3f4; color: #95a5a6; }

        .comparison-box {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
        }
        .compare-item {
            flex: 1;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }
        .compare-item.old {
            background: linear-gradient(135deg, #fee2e2 0%, #fecaca 100%);
        }
        .compare-item.new {
            background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 100%);
        }
        .compare-item .title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .compare-item .score {
            font-size: 36px;
            font-weight: bold;
        }
        .compare-item.old .score { color: #dc2626; }
        .compare-item.new .score { color: #2563eb; }
        .compare-item .desc {
            font-size: 12px;
            margin-top: 4px;
            opacity: 0.7;
        }

        @media (max-width: 1024px) {
            .charts-grid { grid-template-columns: 1fr; }
            .stats-row { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🏪 菜市场烟火气浓度分析系统</h1>
        <p>基于大众点评数据 · 营业时间 · 评论活跃度 · 生鲜品类丰富度</p>
    </div>

    <div class="container">
        <div class="comparison-box">
            <div class="compare-item old">
                <div class="title">🏘️ 老城区</div>
                <div class="score" id="old-score">--</div>
                <div class="desc">传统早市密集，烟火气浓厚</div>
            </div>
            <div class="compare-item new">
                <div class="title">🏙️ 新建商品房区域</div>
                <div class="score" id="new-score">--</div>
                <div class="desc">多为生鲜超市，活力指数较低</div>
            </div>
        </div>

        <div class="stats-row">
            <div class="stat-card">
                <div class="label">市场总数</div>
                <div class="value" id="total-markets">--</div>
            </div>
            <div class="stat-card">
                <div class="label">早市数量 (早6点前开门)</div>
                <div class="value" id="early-markets">--</div>
                <div class="trend up">传统菜市场标志</div>
            </div>
            <div class="stat-card">
                <div class="label">传统菜市场</div>
                <div class="value" id="traditional-markets">--</div>
            </div>
            <div class="stat-card">
                <div class="label">生鲜超市</div>
                <div class="value" id="supermarkets">--</div>
            </div>
        </div>

        <div class="charts-grid">
            <div class="chart-card">
                <div class="chart-title">区域菜市场活力指数旭日图</div>
                <div id="sunburst-chart"></div>
            </div>
            <div class="chart-card">
                <div class="chart-title">各行政区活力指数排名</div>
                <div id="bar-chart"></div>
            </div>
        </div>

        <div class="table-section">
            <div class="chart-title">市场活力详情</div>
            <table id="market-table">
                <thead>
                    <tr>
                        <th>市场名称</th>
                        <th>类型</th>
                        <th>行政区</th>
                        <th>营业时间</th>
                        <th>评论数</th>
                        <th>人均消费</th>
                        <th>活力指数</th>
                        <th>活力等级</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td colspan="8" style="text-align:center;color:#95a5a6;">加载中...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let sunburstChart = echarts.init(document.getElementById('sunburst-chart'));
        let barChart = echarts.init(document.getElementById('bar-chart'));

        function getVitalityBadge(level) {
            const map = {
                '高活力': 'badge-high',
                '中高活力': 'badge-mid-high',
                '中等活力': 'badge-mid',
                '较低活力': 'badge-low-mid',
                '低活力': 'badge-low'
            };
            return `<span class="vitality-badge ${map[level] || 'badge-low'}">${level}</span>`;
        }

        function loadSunburstData() {
            fetch('/api/sunburst')
                .then(res => res.json())
                .then(data => {
                    const option = {
                        tooltip: {
                            trigger: 'item',
                            formatter: function(params) {
                                const d = params.data;
                                let html = `<b>${d.name}</b><br/>`;
                                if (d.vitality_index !== undefined) {
                                    html += `活力指数: ${d.vitality_index}<br/>`;
                                    html += `活力等级: ${d.vitality_level || ''}<br/>`;
                                }
                                if (d.avg_vitality !== undefined) {
                                    html += `平均活力: ${d.avg_vitality}<br/>`;
                                    html += `市场数量: ${d.market_count || 0}<br/>`;
                                }
                                if (d.category) {
                                    html += `类型: ${d.category}<br/>`;
                                }
                                if (d.review_count !== undefined) {
                                    html += `评论数: ${d.review_count}`;
                                }
                                return html;
                            }
                        },
                        series: [{
                            type: 'sunburst',
                            data: data.children || [],
                            radius: ['15%', '90%'],
                            sort: null,
                            emphasis: {
                                focus: 'ancestor'
                            },
                            levels: [
                                {},
                                {
                                    r0: '15%',
                                    r: '40%',
                                    label: {
                                        rotate: 'tangential',
                                        fontSize: 12
                                    }
                                },
                                {
                                    r0: '40%',
                                    r: '90%',
                                    label: {
                                        rotate: 'radial',
                                        fontSize: 10
                                    }
                                }
                            ]
                        }]
                    };
                    sunburstChart.setOption(option);
                })
                .catch(err => console.error('加载旭日图数据失败:', err));
        }

        function loadBarData() {
            fetch('/api/districts')
                .then(res => res.json())
                .then(data => {
                    const districts = Object.keys(data);
                    const values = districts.map(d => data[d].avg_vitality);
                    const colors = values.map(v => {
                        if (v >= 0.8) return '#e74c3c';
                        if (v >= 0.6) return '#e67e22';
                        if (v >= 0.4) return '#f1c40f';
                        if (v >= 0.2) return '#3498db';
                        return '#95a5a6';
                    });

                    const option = {
                        tooltip: {
                            trigger: 'axis',
                            formatter: function(params) {
                                const d = data[params[0].name];
                                return `<b>${params[0].name}</b><br/>
                                    平均活力指数: ${d.avg_vitality}<br/>
                                    市场数量: ${d.market_count}<br/>
                                    早市数量: ${d.early_market_count}`;
                            }
                        },
                        grid: {
                            left: '3%',
                            right: '4%',
                            bottom: '3%',
                            containLabel: true
                        },
                        xAxis: {
                            type: 'value',
                            max: 1,
                            axisLabel: { show: false }
                        },
                        yAxis: {
                            type: 'category',
                            data: districts,
                            axisLabel: { fontSize: 12 }
                        },
                        series: [{
                            type: 'bar',
                            data: values.map((v, i) => ({
                                value: v,
                                itemStyle: { color: colors[i] }
                            })),
                            barWidth: 16,
                            label: {
                                show: true,
                                position: 'right',
                                fontSize: 11,
                                formatter: '{c}'
                            }
                        }]
                    };
                    barChart.setOption(option);
                })
                .catch(err => console.error('加载柱状图数据失败:', err));
        }

        function loadMarketsTable() {
            fetch('/api/markets')
                .then(res => res.json())
                .then(data => {
                    const sorted = data.sort((a, b) => b.vitality_index - a.vitality_index);

                    let total = sorted.length;
                    let earlyCount = sorted.filter(m => m.opens_early).length;
                    let traditionalCount = sorted.filter(m => m.category === '菜市场').length;
                    let supermarketCount = sorted.filter(m => m.category === '生鲜超市').length;

                    document.getElementById('total-markets').textContent = total;
                    document.getElementById('early-markets').textContent = earlyCount;
                    document.getElementById('traditional-markets').textContent = traditionalCount;
                    document.getElementById('supermarkets').textContent = supermarketCount;

                    const tbody = document.querySelector('#market-table tbody');
                    tbody.innerHTML = sorted.map(m => `
                        <tr>
                            <td>${m.name}</td>
                            <td>${m.category || '-'}</td>
                            <td>${m.district || '-'}</td>
                            <td>${m.business_hours || '-'}</td>
                            <td>${m.review_count || 0}</td>
                            <td>${m.avg_price ? '¥' + m.avg_price : '-'}</td>
                            <td><b>${m.vitality_index}</b></td>
                            <td>${getVitalityBadge(m.vitality_level)}</td>
                        </tr>
                    `).join('');
                })
                .catch(err => {
                    console.error('加载市场数据失败:', err);
                    document.querySelector('#market-table tbody').innerHTML =
                        '<tr><td colspan="8" style="text-align:center;color:#e74c3c;">数据加载失败</td></tr>';
                });
        }

        function loadComparison() {
            fetch('/api/comparison')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('old-score').textContent = data.old_districts.avg_vitality;
                    document.getElementById('new-score').textContent = data.new_developments.avg_vitality;
                })
                .catch(err => console.error('加载对比数据失败:', err));
        }

        function init() {
            loadSunburstData();
            loadBarData();
            loadMarketsTable();
            loadComparison();
        }

        window.addEventListener('resize', function() {
            sunburstChart.resize();
            barChart.resize();
        });

        init();
    </script>
</body>
</html>
