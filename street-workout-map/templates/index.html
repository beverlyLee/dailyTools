<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>街头健身地图 - 寻找身边的健身圣地</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: #0a0e1a;
            color: #e0e6f0;
            overflow: hidden;
        }

        #app {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        #sidebar {
            width: 360px;
            background: linear-gradient(180deg, #111827 0%, #0f172a 100%);
            border-right: 1px solid #1e293b;
            display: flex;
            flex-direction: column;
            z-index: 1000;
            box-shadow: 2px 0 20px rgba(0, 0, 0, 0.3);
        }

        .sidebar-header {
            padding: 24px 20px;
            border-bottom: 1px solid #1e293b;
            background: linear-gradient(135deg, #1e3a5f 0%, #0f172a 100%);
        }

        .sidebar-header h1 {
            font-size: 20px;
            font-weight: 700;
            color: #60a5fa;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-header h1::before {
            content: "🏋️";
            font-size: 24px;
        }

        .sidebar-header p {
            font-size: 13px;
            color: #94a3b8;
        }

        .filters {
            padding: 16px 20px;
            border-bottom: 1px solid #1e293b;
        }

        .filter-section {
            margin-bottom: 16px;
        }

        .filter-section:last-child {
            margin-bottom: 0;
        }

        .filter-label {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 8px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .filter-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .filter-btn {
            padding: 6px 14px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 20px;
            color: #94a3b8;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .filter-btn:hover {
            background: #334155;
            color: #e2e8f0;
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            border-color: #3b82f6;
            color: white;
        }

        .stats-section {
            padding: 16px 20px;
            border-bottom: 1px solid #1e293b;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .stat-card {
            background: #1e293b;
            border-radius: 12px;
            padding: 14px;
            border: 1px solid #334155;
        }

        .stat-number {
            font-size: 24px;
            font-weight: 700;
            color: #60a5fa;
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 11px;
            color: #94a3b8;
        }

        .location-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px;
        }

        .location-item {
            padding: 14px;
            margin-bottom: 10px;
            background: #1e293b;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid #334155;
        }

        .location-item:hover {
            background: #334155;
            transform: translateX(4px);
        }

        .location-item.active {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.2) 0%, rgba(37, 99, 235, 0.1) 100%);
            border-color: #3b82f6;
        }

        .location-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .location-name {
            font-size: 14px;
            font-weight: 600;
            color: #e2e8f0;
            flex: 1;
        }

        .heat-badge {
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            flex-shrink: 0;
            margin-left: 8px;
        }

        .heat-high {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
        }

        .heat-medium {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: white;
        }

        .heat-low {
            background: linear-gradient(135deg, #6b7280 0%, #4b5563 100%);
            color: white;
        }

        .heat-super {
            background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
            color: white;
        }

        .location-meta {
            display: flex;
            gap: 12px;
            font-size: 12px;
            color: #94a3b8;
        }

        .location-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .condition-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 500;
        }

        .condition-excellent {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
        }

        .condition-good {
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
        }

        .condition-fair {
            background: rgba(234, 179, 8, 0.2);
            color: #eab308;
        }

        .condition-poor {
            background: rgba(249, 115, 22, 0.2);
            color: #f97316;
        }

        .condition-broken {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        #map-container {
            flex: 1;
            position: relative;
        }

        #map {
            height: 100%;
            width: 100%;
            background: #0a0e1a;
        }

        .leaflet-container {
            background: #0a0e1a;
        }

        .dumbbell-marker {
            position: relative;
            transform: translate(-50%, -50%);
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .dumbbell-marker:hover {
            transform: translate(-50%, -50%) scale(1.15);
        }

        .dumbbell-icon {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: inherit;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.4));
        }

        .pulse-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            animation: pulse 2s ease-out infinite;
            pointer-events: none;
        }

        @keyframes pulse {
            0% {
                width: 20px;
                height: 20px;
                opacity: 0.6;
            }
            100% {
                width: 60px;
                height: 60px;
                opacity: 0;
            }
        }

        .custom-popup {
            min-width: 280px;
            max-width: 320px;
            font-family: inherit;
        }

        .leaflet-popup-content-wrapper {
            background: #1e293b;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
        }

        .leaflet-popup-tip {
            background: #1e293b;
        }

        .leaflet-popup-content {
            margin: 16px;
            width: auto !important;
        }

        .popup-header {
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid #334155;
        }

        .popup-title {
            font-size: 16px;
            font-weight: 700;
            color: #e2e8f0;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .popup-info {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }

        .popup-tag {
            padding: 4px 10px;
            background: #334155;
            border-radius: 12px;
            font-size: 11px;
            color: #94a3b8;
        }

        .popup-stats {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-bottom: 14px;
        }

        .popup-stat {
            text-align: center;
            padding: 10px 6px;
            background: #0f172a;
            border-radius: 10px;
        }

        .popup-stat-value {
            font-size: 16px;
            font-weight: 700;
            color: #60a5fa;
            margin-bottom: 2px;
        }

        .popup-stat-label {
            font-size: 10px;
            color: #64748b;
        }

        .popup-section-title {
            font-size: 13px;
            font-weight: 600;
            color: #e2e8f0;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .photo-item {
            aspect-ratio: 1;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .photo-item:hover {
            transform: scale(1.05);
        }

        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .posts-list {
            max-height: 200px;
            overflow-y: auto;
        }

        .post-item {
            padding: 10px;
            background: #0f172a;
            border-radius: 10px;
            margin-bottom: 8px;
        }

        .post-item:last-child {
            margin-bottom: 0;
        }

        .post-title {
            font-size: 13px;
            font-weight: 500;
            color: #e2e8f0;
            margin-bottom: 4px;
        }

        .post-meta {
            font-size: 11px;
            color: #64748b;
            display: flex;
            justify-content: space-between;
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(10, 14, 26, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid #334155;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            margin-top: 16px;
            color: #94a3b8;
            font-size: 14px;
        }

        .legend {
            position: absolute;
            bottom: 24px;
            right: 24px;
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 16px;
            z-index: 500;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .legend-title {
            font-size: 13px;
            font-weight: 600;
            color: #e2e8f0;
            margin-bottom: 12px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            font-size: 12px;
            color: #94a3b8;
        }

        .legend-item:last-child {
            margin-bottom: 0;
        }

        .legend-icon {
            font-size: 18px;
        }

        .heat-scale {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
        }

        .scale-bar {
            flex: 1;
            height: 6px;
            background: linear-gradient(90deg, #6b7280 0%, #f59e0b 50%, #ef4444 100%);
            border-radius: 3px;
        }

        .scale-labels {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: #64748b;
            margin-top: 4px;
        }

        .image-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            cursor: pointer;
        }

        .image-modal img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .image-modal-close {
            position: absolute;
            top: 24px;
            right: 24px;
            font-size: 32px;
            color: white;
            cursor: pointer;
            opacity: 0.8;
        }

        .image-modal-close:hover {
            opacity: 1;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #0f172a;
        }

        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="sidebar">
            <div class="sidebar-header">
                <h1>街头健身地图</h1>
                <p>发现身边的街头健身圣地</p>
            </div>

            <div class="filters">
                <div class="filter-section">
                    <div class="filter-label">热度筛选</div>
                    <div class="filter-buttons">
                        <button class="filter-btn active" data-filter="all">全部</button>
                        <button class="filter-btn" data-filter="high">高热度</button>
                        <button class="filter-btn" data-filter="medium">中热度</button>
                        <button class="filter-btn" data-filter="low">低热度</button>
                    </div>
                </div>
                <div class="filter-section">
                    <div class="filter-label">类型筛选</div>
                    <div class="filter-buttons">
                        <button class="filter-btn active" data-type="all">全部</button>
                        <button class="filter-btn" data-type="park">公园</button>
                        <button class="filter-btn" data-type="residential">小区</button>
                    </div>
                </div>
            </div>

            <div class="stats-section">
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-number" id="total-count">0</div>
                        <div class="stat-label">健身点总数</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="high-count">0</div>
                        <div class="stat-label">高热度地点</div>
                    </div>
                </div>
            </div>

            <div class="location-list" id="location-list">
            </div>
        </div>

        <div id="map-container">
            <div id="map"></div>
            <div class="loading-overlay" id="loading">
                <div style="text-align: center;">
                    <div class="loading-spinner"></div>
                    <div class="loading-text">加载健身地点数据中...</div>
                </div>
            </div>
            <div class="legend">
                <div class="legend-title">图标说明</div>
                <div class="legend-item">
                    <span class="legend-icon">🏋️</span>
                    <span>公共健身点</span>
                </div>
                <div class="legend-item">
                    <span class="legend-icon">🏛️</span>
                    <span>公园健身点</span>
                </div>
                <div class="legend-item">
                    <span class="legend-icon">🏠</span>
                    <span>小区健身点</span>
                </div>
                <div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid #334155;">
                    <div class="legend-title" style="margin-bottom: 8px;">热度等级</div>
                    <div class="heat-scale">
                        <div class="scale-bar"></div>
                    </div>
                    <div class="scale-labels">
                        <span>低</span>
                        <span>高</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let map;
        let markers = [];
        let allLocations = [];
        let currentFilter = 'all';
        let currentType = 'all';
        let activeMarker = null;

        function initMap() {
            map = L.map('map', {
                center: [31.2304, 121.4737],
                zoom: 12,
                zoomControl: true
            });

            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
                subdomains: 'abcd',
                maxZoom: 19
            }).addTo(map);

            loadLocations();
        }

        async function loadLocations() {
            try {
                const response = await fetch('/api/heat');
                const result = await response.json();
                
                if (result.code === 0) {
                    allLocations = result.data;
                    updateStats();
                    renderLocationList();
                    renderMarkers();
                }
                
                document.getElementById('loading').style.display = 'none';
            } catch (error) {
                console.error('加载数据失败:', error);
                document.getElementById('loading').style.display = 'none';
            }
        }

        function updateStats() {
            document.getElementById('total-count').textContent = allLocations.length;
            const highCount = allLocations.filter(l => l.heat_score >= 0.6).length;
            document.getElementById('high-count').textContent = highCount;
        }

        function getHeatLevel(score) {
            if (score >= 0.8) return 'super';
            if (score >= 0.6) return 'high';
            if (score >= 0.4) return 'medium';
            if (score >= 0.2) return 'low';
            return 'very-low';
        }

        function getHeatLabel(level) {
            const labels = {
                'super': '超高热度',
                'high': '高热度',
                'medium': '中等热度',
                'low': '低热度',
                'very-low': '极低热度'
            };
            return labels[level] || '未知';
        }

        function getHeatClass(level) {
            const classes = {
                'super': 'heat-super',
                'high': 'heat-high',
                'medium': 'heat-medium',
                'low': 'heat-low',
                'very-low': 'heat-low'
            };
            return classes[level] || 'heat-low';
        }

        function getConditionClass(condition) {
            const classes = {
                'excellent': 'condition-excellent',
                'good': 'condition-good',
                'fair': 'condition-fair',
                'poor': 'condition-poor',
                'broken': 'condition-broken'
            };
            return classes[condition] || 'condition-fair';
        }

        function getMarkerSize(heatScore) {
            const minSize = 28;
            const maxSize = 52;
            return minSize + (maxSize - minSize) * heatScore;
        }

        function getMarkerIcon(location) {
            if (location.is_park) {
                return '🏛️';
            }
            if (location.type === '老旧小区' || location.equipment_condition === 'broken') {
                return '🏚️';
            }
            if (location.type === '住宅小区') {
                return '🏠';
            }
            return '🏋️';
        }

        function createDumbbellIcon(location) {
            const size = getMarkerSize(location.heat_score);
            const icon = getMarkerIcon(location);
            const heatLevel = getHeatLevel(location.heat_score);
            
            const colorMap = {
                'super': '#f97316',
                'high': '#ef4444',
                'medium': '#f59e0b',
                'low': '#6b7280',
                'very-low': '#4b5563'
            };
            
            const color = colorMap[heatLevel] || '#6b7280';
            const showPulse = location.heat_score >= 0.6;
            
            return L.divIcon({
                className: 'dumbbell-marker-wrapper',
                html: `
                    <div class="dumbbell-marker" style="width: ${size}px; height: ${size}px; font-size: ${size * 0.6}px;">
                        ${showPulse ? `<div class="pulse-ring" style="border: 2px solid ${color};"></div>` : ''}
                        <div class="dumbbell-icon">${icon}</div>
                    </div>
                `,
                iconSize: [size, size],
                iconAnchor: [size / 2, size / 2],
                popupAnchor: [0, -size / 2]
            });
        }

        function renderMarkers() {
            markers.forEach(m => map.removeLayer(m));
            markers = [];

            const filteredLocations = getFilteredLocations();

            filteredLocations.forEach(location => {
                const icon = createDumbbellIcon(location);
                const marker = L.marker([location.latitude, location.longitude], { icon: icon });
                
                marker.bindPopup(createPopupContent(location), {
                    className: 'custom-popup',
                    maxWidth: 340
                });

                marker.on('click', () => {
                    highlightLocation(location.id);
                });

                marker.addTo(map);
                markers.push(marker);
            });
        }

        function createPopupContent(location) {
            const heatLevel = getHeatLevel(location.heat_score);
            const conditionClass = getConditionClass(location.equipment_condition);
            
            const photosHtml = location.images && location.images.length > 0 
                ? location.images.slice(0, 6).map(img => `
                    <div class="photo-item" onclick="showImageModal('${img}')">
                        <img src="${img}" alt="健身照片" loading="lazy" />
                    </div>
                `).join('')
                : '<div style="color: #64748b; font-size: 12px;">暂无照片</div>';

            const postsHtml = location.posts && location.posts.length > 0
                ? `<div class="posts-list">
                    ${location.posts.map(post => `
                        <div class="post-item">
                            <div class="post-title">${post.title}</div>
                            <div class="post-meta">
                                <span>${post.author}</span>
                                <span>❤️ ${post.likes}</span>
                            </div>
                        </div>
                    `).join('')}
                   </div>`
                : '';

            const tagsHtml = location.fitness_tags 
                ? location.fitness_tags.map(tag => `<span class="popup-tag">${tag}</span>`).join('')
                : '';

            return `
                <div class="popup-header">
                    <div class="popup-title">
                        ${location.name}
                        <span class="heat-badge ${getHeatClass(heatLevel)}">${getHeatLabel(heatLevel)}</span>
                    </div>
                    <div style="font-size: 12px; color: #64748b;">
                        ${location.address || ''}
                    </div>
                </div>
                
                <div class="popup-info">
                    ${tagsHtml}
                </div>

                <div class="popup-stats">
                    <div class="popup-stat">
                        <div class="popup-stat-value">${location.mention_count}</div>
                        <div class="popup-stat-label">提及次数</div>
                    </div>
                    <div class="popup-stat">
                        <div class="popup-stat-value">${location.total_likes.toLocaleString()}</div>
                        <div class="popup-stat-label">总点赞</div>
                    </div>
                    <div class="popup-stat">
                        <div class="popup-stat-value">${location.equipment_count}</div>
                        <div class="popup-stat-label">器材数量</div>
                    </div>
                </div>

                <div class="popup-section-title">
                    <span>📷</span> 网友实拍
                </div>
                <div class="photo-grid">
                    ${photosHtml}
                </div>

                ${postsHtml ? `
                    <div style="margin-top: 14px;">
                        <div class="popup-section-title">
                            <span>📝</span> 相关帖子
                        </div>
                        ${postsHtml}
                    </div>
                ` : ''}
            `;
        }

        function getFilteredLocations() {
            return allLocations.filter(loc => {
                if (currentFilter !== 'all') {
                    const heatLevel = getHeatLevel(loc.heat_score);
                    if (currentFilter === 'high' && heatLevel !== 'high' && heatLevel !== 'super') return false;
                    if (currentFilter === 'medium' && heatLevel !== 'medium') return false;
                    if (currentFilter === 'low' && heatLevel !== 'low' && heatLevel !== 'very-low') return false;
                }
                
                if (currentType !== 'all') {
                    if (currentType === 'park' && !loc.is_park) return false;
                    if (currentType === 'residential' && loc.is_park) return false;
                }
                
                return true;
            });
        }

        function renderLocationList() {
            const list = document.getElementById('location-list');
            const filtered = getFilteredLocations();
            
            if (filtered.length === 0) {
                list.innerHTML = '<div style="text-align: center; color: #64748b; padding: 40px 20px;">暂无符合条件的地点</div>';
                return;
            }

            list.innerHTML = filtered.map((loc, index) => {
                const heatLevel = getHeatLevel(loc.heat_score);
                const conditionClass = getConditionClass(loc.equipment_condition);
                const icon = getMarkerIcon(loc);
                
                return `
                    <div class="location-item" data-id="${loc.id}" onclick="focusLocation('${loc.id}')">
                        <div class="location-header">
                            <span class="location-name">${icon} ${loc.name}</span>
                            <span class="heat-badge ${getHeatClass(heatLevel)}">${getHeatLabel(heatLevel)}</span>
                        </div>
                        <div class="location-meta">
                            <span>📍 ${loc.district || '未知'}</span>
                            <span class="condition-badge ${conditionClass}">${loc.equipment_condition_label}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function focusLocation(id) {
            const location = allLocations.find(l => l.id === id);
            if (location) {
                map.setView([location.latitude, location.longitude], 14, { animate: true });
                
                markers.forEach(m => {
                    const markerLatLng = m.getLatLng();
                    if (Math.abs(markerLatLng.lat - location.latitude) < 0.0001 && 
                        Math.abs(markerLatLng.lng - location.longitude) < 0.0001) {
                        m.openPopup();
                    }
                });
                
                highlightLocation(id);
            }
        }

        function highlightLocation(id) {
            document.querySelectorAll('.location-item').forEach(item => {
                item.classList.remove('active');
                if (item.dataset.id === id) {
                    item.classList.add('active');
                    item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            });
        }

        function showImageModal(src) {
            const modal = document.createElement('div');
            modal.className = 'image-modal';
            modal.onclick = () => modal.remove();
            modal.innerHTML = `
                <span class="image-modal-close">&times;</span>
                <img src="${src}" alt="大图预览" />
            `;
            document.body.appendChild(modal);
        }

        document.querySelectorAll('.filter-btn[data-filter]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn[data-filter]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                renderLocationList();
                renderMarkers();
            });
        });

        document.querySelectorAll('.filter-btn[data-type]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn[data-type]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentType = btn.dataset.type;
                renderLocationList();
                renderMarkers();
            });
        });

        document.addEventListener('DOMContentLoaded', initMap);
    </script>
</body>
</html>
